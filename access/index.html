.flt button[aria-pressed="true"]{background:var(--acc);color:#fff;border-color:var(--acc)}
@media (max-width:760px){.wrap{padding:16px 14px 40px}.kp{grid-template-columns:repeat(2,minmax(0,1fr))}
 .log thead{display:none}.log,.log tbody,.log tr,.log td{display:block}.log tr{padding:8px 2px;border-bottom:1px solid var(--line)}.log td{border:0;padding:1px 0}
 .log td[data-l]:before{content:attr(data-l) " ";color:var(--mut);font-size:12px}.log td.t{font-weight:700}}
</style><!--SKIN--><style>

<script>
(function(){

   '<div class="k"><div class="l">오늘 접속</div><div class="v">'+T.length.toLocaleString()+'<small>건</small></div><div class="d">기기 '+uniq(T)+'대</div></div>'+
