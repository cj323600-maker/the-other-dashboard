<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>코오롱오토옥션 일간 보고</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --ink:#0f1a24; --muted:#6b7c8c; --line:#e3e8ed; --canvas:#f2f4f7; --surface:#fff;
  --ok:#0e7c66; --warn:#b47800; --bad:#c0392b; --blue:#1f6feb; --slate:#5c7d99;
  --navy:#0d2238; --mint:#dbeee8; --rose:#f6e3df; --purple:#7c4dbe;
  --sans:"Pretendard Variable",Pretendard,-apple-system,system-ui,"Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--canvas);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h2,h3,p{margin:0}
.pageTop{background:var(--ink);color:#fff;padding:14px 16px;border-bottom:3px solid var(--ok)}
.pageTop .r1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pageTop b{font-size:16px;letter-spacing:-.03em}
.pageTop .tag{margin-left:auto;color:#ffb4ac;border:1px solid rgba(255,180,172,.45);padding:2px 7px;border-radius:4px;font-size:10.5px;font-weight:800}
.pageTop .r2{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:5px;color:#9fb3c4;font-size:11.5px}
.pageTop .r2 .pace{color:#ffd79a;border:1px solid rgba(255,215,154,.45);padding:2px 7px;border-radius:4px;font-weight:800}
.wrap{max-width:1180px;margin:0 auto;padding:14px 14px 46px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:10px;padding:12px}
.kpi.ok{border-left-color:var(--ok)} .kpi.warn{border-left-color:var(--warn)} .kpi.bad{border-left-color:var(--bad)}
.kpi .t{font-size:11px;color:var(--muted);font-weight:700}
.kpi .v{font-size:23px;font-weight:850;line-height:1.12;letter-spacing:-.05em;margin-top:3px;font-variant-numeric:tabular-nums}
.kpi .v em{font-size:11px;font-style:normal;font-weight:650;color:var(--muted);margin-left:2px}
.kpi .s{font-size:10.5px;color:var(--muted);margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);line-height:1.45}
.kpi .s b{color:var(--ink)}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px}
.stitle{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.stitle h2{font-size:14px;font-weight:850;letter-spacing:-.03em}
.stitle .sub{font-size:10.5px;color:var(--muted)}
.stitle .unit{margin-left:auto;font-size:10.5px;color:var(--muted)}

/* scorecard */
.score{padding:0;overflow:hidden}
.score .stitle{padding:12px 12px 0}
.scoreTbl{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}
.scoreTbl th{background:var(--navy);color:#fff;font-size:10.5px;font-weight:800;padding:10px 6px;text-align:center;white-space:nowrap}
.scoreTbl th:first-child{width:31%;text-align:left;padding-left:14px;border-top-left-radius:10px}
.scoreTbl th:last-child{border-top-right-radius:10px}
.scoreTbl td{border-bottom:1px solid #dfe5ea;padding:10px 7px;vertical-align:middle;background:#fff}
.scoreTbl tr:last-child td{border-bottom:0}
.scoreTbl tbody tr{transition:background .15s ease}
.scoreTbl tbody tr.top1 td{background:#fffaf0}
.scoreTbl tbody tr.top1 td:first-child{box-shadow:inset 4px 0 0 #b47800}
.scoreTbl tbody tr:last-child td:first-child{box-shadow:inset 4px 0 0 #d9e0e6}
.scoreTbl td:first-child{padding-left:14px;background:#f9fbfc}
.scoreTbl tr:nth-child(even) td:first-child{background:#f5f8fa}
.tmline{display:flex;align-items:center;gap:9px;min-width:0}
.rk{display:inline-flex;align-items:center;justify-content:center;width:25px;height:25px;border-radius:50%;background:#e9eef3;color:#526779;font-weight:900;font-size:10.5px;flex:0 0 auto;border:1px solid #dbe3e9}
.top1 .rk{background:#ffead0;color:#8a5c00;border-color:#edc77b}
.tmbox{min-width:0}
.tmbox .nm{display:block;font-size:13.5px;font-weight:900;letter-spacing:-.035em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tmbox .ow{display:block;font-size:10px;color:var(--muted);line-height:1.35;margin-top:1px}
.hit{display:inline-flex;align-items:center;justify-content:center;margin-left:auto;min-width:39px;padding:3px 7px;border-radius:6px;font-size:10.5px;font-weight:900;color:#fff;vertical-align:1px;box-shadow:0 1px 1px rgba(15,26,36,.08)}
.hit.g{background:var(--ok)} .hit.r{background:var(--bad)} .hit.w{background:var(--warn)}
.metricCell{border-radius:9px;padding:9px 4px;text-align:center;border:1px solid;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.metricCell.g{background:#eaf7f1;border-color:#bfe4d5}
.metricCell.r{background:#fdecea;border-color:#f5c9c3}
.metricCell.w{background:#fdf7e8;border-color:#edd39b}
.metricCell .v{display:block;font-size:14.5px;font-weight:900;letter-spacing:-.045em;line-height:1.12;font-variant-numeric:tabular-nums}
.metricCell .d{display:inline-block;margin-top:5px;border-radius:999px;padding:2px 7px;font-size:10px;font-weight:900;font-variant-numeric:tabular-nums}
.metricCell.g .d{background:#cdeee0;color:#0a6553}
.metricCell.r .d{background:#f9d5cf;color:#a5301f}
.metricCell.w .d{background:#f5e8c6;color:#946400}
.summaryGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 12px 10px}
.sumBox{border-radius:10px;padding:11px 12px}
.sumBox.good{background:#f1f9f5;border-left:3px solid var(--ok)}
.sumBox.bad{background:#fdf1ef;border-left:3px solid var(--bad)}
.sumBox b{display:block;font-size:11px;margin-bottom:4px}
.sumBox.good b{color:var(--ok)} .sumBox.bad b{color:var(--bad)}
.sumBox .team{display:block;font-size:13px;font-weight:850;letter-spacing:-.03em;color:var(--ink);margin-top:4px}
.sumBox .desc{display:block;font-size:10.5px;color:var(--muted);line-height:1.45}
.oneLine{margin:0 12px 12px;background:var(--ink);border-radius:10px;padding:11px 13px}
.oneLine b{display:block;font-size:10.5px;color:#ffc98a;margin-bottom:3px}
.oneLine span{display:block;font-size:12.5px;font-weight:800;color:#fff;letter-spacing:-.02em;line-height:1.45}
.scoreHero{display:flex;gap:8px;flex-wrap:wrap;padding:0 12px 10px}
.scoreHero .chip{display:flex;align-items:center;gap:5px;background:#f6f8fa;border:1px solid var(--line);border-radius:999px;padding:5px 8px;font-size:10.5px;color:var(--muted)}
.scoreHero .chip b{font-size:11px;color:var(--ink)}
.scoreHero .chip.first{background:#fff7e8;border-color:#edd39b;color:#8a5c00}
.scoreHero .chip.first b{color:#8a5c00}
.scoreHero .dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--slate)}

/* detail cards */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.dcard .hd{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.dcard .hd h3{font-size:13px;font-weight:850;letter-spacing:-.03em}
.dcard .hd .u{margin-left:auto;font-size:10px;color:var(--muted)}
.cw{position:relative;height:220px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:8px}
.table{width:100%;border-collapse:collapse;font-size:11px;min-width:0}
.table th{font-size:9.5px;color:var(--muted);background:#f8fafb;padding:6px 5px;border-bottom:1px solid #cfd8e0;text-align:right;font-weight:800}
.table td{padding:6px 5px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.table th:first-child,.table td:first-child{text-align:left}
.table tr.best td{background:#faf7ff}
.table tr.best td:first-child{font-weight:800;color:#5b3a8c}
.table tr:last-child td{border-bottom:0}
.badge{display:inline-block;border-radius:999px;padding:1px 5px;font-size:9px;font-weight:850;border:1px solid}
.badge.ok{color:var(--ok);background:#eefaf6;border-color:#b8ddd3}
.badge.bad{color:var(--bad);background:#fdeeec;border-color:#f2c4bd}
.badge.warn{color:var(--warn);background:#fdf7e8;border-color:#edd39b}
.ai{margin-top:8px;background:#f6f8fa;border:1px solid var(--line);border-radius:7px;padding:8px 9px;font-size:10.5px;line-height:1.55}
.ai span{display:inline-block;margin-right:5px;background:var(--slate);color:#fff;border-radius:3px;padding:1px 5px;font-size:9px;font-weight:850}


/* weekly-style collapsible sections */
details.fold{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:12px;overflow:hidden}
details.fold>summary{list-style:none;cursor:pointer;padding:13px 14px;font-size:13px;font-weight:900;letter-spacing:-.025em;display:flex;align-items:center;gap:7px;background:#fff;user-select:none}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary .ft{white-space:nowrap;color:var(--ink)}
details.fold>summary .fs{font-style:normal;font-weight:650;color:var(--muted);font-size:10.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.fold>summary .fb{font-size:9.5px;font-weight:850;color:var(--slate);background:#eef3f7;border:1px solid #d9e2e9;border-radius:999px;padding:2px 7px;white-space:nowrap}
details.fold>summary .ar{color:var(--muted);font-size:12px;transition:transform .18s ease;display:inline-block}
details.fold[open]>summary{border-bottom:1px solid var(--line);background:#fbfcfd}
details.fold[open]>summary .ar{transform:rotate(180deg)}
.foldBody{padding:12px;background:var(--canvas)}
.foldBody>.sec{margin-bottom:0;border-radius:10px}
.foldBody>.sec>.stitle:first-child{margin-top:0}

/* operational blocks */
.partGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.opCard{border:1px solid var(--line);border-radius:10px;padding:11px;background:#fbfcfd}
.opCard .hd{display:flex;align-items:center;gap:6px}
.opCard .nm{font-size:12px;font-weight:850;letter-spacing:-.03em}
.opCard .sm{font-size:10px;color:var(--muted)}
.opCard .main{display:flex;align-items:baseline;gap:8px;margin-top:8px}
.opCard .main .v{font-size:22px;font-weight:900;letter-spacing:-.045em;line-height:1.1;font-variant-numeric:tabular-nums}
.opCard .main .u{font-size:11px;color:var(--muted);font-weight:700}
.opCard .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.opCard .mini div{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 5px;text-align:center}
.opCard .mini b{display:block;font-size:10px;color:var(--muted);margin-bottom:2px}
.opCard .mini span{display:block;font-size:11.5px;font-weight:850}
.bar{height:8px;background:#e7edf2;border-radius:999px;overflow:hidden;margin-top:8px}
.bar>span{display:block;height:100%;background:var(--ok);border-radius:999px}
.break{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px;font-size:10px;color:var(--muted);line-height:1.45}
.break b{color:var(--ink)}
.statRow{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.stat{background:#f8fafb;border:1px solid var(--line);border-radius:10px;padding:11px}
.stat .t{font-size:10.5px;color:var(--muted);font-weight:750}
.stat .v{font-size:21px;font-weight:900;letter-spacing:-.04em;line-height:1.12;margin-top:3px;font-variant-numeric:tabular-nums}
.stat .v em{font-style:normal;font-size:11px;color:var(--muted);font-weight:650;margin-left:2px}
.procWrap{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.proc{background:#fbfcfd;border:1px solid var(--line);border-radius:10px;padding:12px}
.proc .r{display:flex;align-items:baseline;gap:7px}
.proc .nm{font-size:12px;font-weight:850}
.proc .val{margin-left:auto;font-size:21px;font-weight:900;letter-spacing:-.04em}
.proc .rt{font-size:11px;font-weight:850}
.proc.release .bar>span{background:var(--slate)}
.dayStrip{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.dayStrip .day{background:#f8fafb;border:1px solid var(--line);border-radius:9px;padding:8px 6px;text-align:center}
.dayStrip .day b{display:block;font-size:10px;color:var(--muted);margin-bottom:4px}
.dayStrip .day span{display:block;font-size:16px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.dayStrip .day em{display:block;font-style:normal;font-size:10px;color:var(--muted);margin-top:3px}
.issue{margin-top:10px;background:#f6f8fa;border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:8px;padding:9px 10px;font-size:11px;line-height:1.55}
.issue b{font-size:10.5px;color:var(--warn);margin-right:5px}
.note{font-size:10.5px;color:var(--muted);line-height:1.6;margin-top:10px}
.note b{color:var(--ink)}
.formula{background:#fbfcfd;border:1px dashed #cfd8e0;border-radius:8px;padding:8px 10px;font-size:10px;color:var(--muted);margin-top:8px}
.formula code{font-family:var(--sans);font-weight:800;color:var(--ink)}
.pos{color:var(--ok)!important}.neg{color:var(--bad)!important}.warnTxt{color:var(--warn)!important}

@media(max-width:1024px){
  .partGrid{grid-template-columns:1fr 1fr}
}
@media(max-width:860px){
  .kpis,.grid2,.summaryGrid,.statRow,.partGrid,.procWrap{grid-template-columns:1fr 1fr}
  .scoreTbl{table-layout:auto}
}
@media(max-width:620px){
  .wrap{max-width:560px}
  .kpis,.grid2,.summaryGrid,.partGrid,.procWrap,.statRow{grid-template-columns:1fr}
  .dayStrip{grid-template-columns:repeat(3,1fr)}
  .scoreTbl th:first-child{width:140px}
  .scoreTbl th,.scoreTbl td{padding:6px 4px}
  .metricCell .v{font-size:12px}
  .pageTop .tag{margin-left:0}
  .stitle .unit{margin-left:0;flex-basis:100%}
}
</style>
</head>
<body>
<header class="pageTop">
  <div class="r1"><b>코오롱오토옥션 일간 보고</b><span class="tag">[대외비]</span></div>
  <div class="r2" id="meta"></div>
</header>
<main class="wrap" id="app"></main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
const DATA = {
  asOf:'2026-08-28',
  businessDays:{total:20, elapsed:18},
  finance:{
    revenueTarget:22259986511,
    revenueForecast:19730393778.5,
    gpTarget:1252815661,
    gpForecast:1211103728.5
  },
  teams:[
    {
      name:'플랫폼매입', owner:'조성익',
      acq:{target:200, today:18, actual:188, own:188, induced:0},
      rev:{target:1823976000, actual:1808818186},
      gp:{target:34584640, actual:78027034}
    },
    {
      name:'경매운영(FC)', owner:'정경태',
      acq:{target:1374, today:41, actual:1119, own:440, induced:679},
      rev:{target:5931455468, actual:5945703660},
      gp:{target:427995518, actual:451263724}
    },
    {
      name:'법인영업', owner:'김지훈',
      acq:{target:1040, today:9, actual:1551, own:56, induced:1495},
      rev:{target:2938974227, actual:985205700},
      gp:{target:227700258, actual:191610447}
    },
    {
      name:'출품영업', owner:'최현우',
      acq:{target:1994, today:80, actual:1747, own:1141, induced:606},
      rev:{target:11369164070, actual:10029595991},
      gp:{target:451594678, actual:427318784}
    }
  ],
  yard:{ owner:'정경태', purchase:137, inbound:89, inspection:199, registered:32, exposed:1730 },
  auction:{
    owner:'남윤정', auctionDate:'2026-08-26', won:975,
    settlement:[462,0,0,0,0],
    release:[253,0,0,0,0],
    issue:'8/26 10대 미수 · 8/27~28일 정산 예정'
  }
};

const pace = DATA.businessDays.elapsed / DATA.businessDays.total;
const actualPace = pace;
const cm = n => Math.round(n).toLocaleString('ko-KR');
const mil = n => Math.round(n/1e6).toLocaleString('ko-KR');
const man1 = n => (n/10000).toFixed(1);
const pct1 = n => (n*100).toFixed(1)+'%';
const pct0 = n => Math.round(n*100)+'%';
const pp1 = n => (n>=0?'+':'') + (n*100).toFixed(1) + '%p';
const diffNum = n => (n>=0?'+':'−') + cm(Math.abs(n));
const diffMil = n => (n>=0?'+':'−') + mil(Math.abs(n));
const diffMan = n => (n>=0?'+':'−') + (Math.abs(n)/10000).toFixed(1);
const sum = arr => arr.reduce((a,b)=>a+b,0);

DATA.teams.forEach(t=>{
  t.upi = {
    target: t.gp.target / t.acq.target,
    actual: t.gp.actual / t.acq.actual
  };
  const revDaily = t.rev.actual * actualPace;
  const gpDaily = t.gp.actual * actualPace;
  const upiDaily = gpDaily / t.acq.actual;
  t.metrics = {
    acq:{ key:'acq', label:'매입', unit:'대', target:t.acq.target, actual:t.acq.actual, today:t.acq.today, fmt:'num', diff:t.acq.actual-t.acq.target, ach:t.acq.actual/t.acq.target },
    rev:{ key:'rev', label:'매출', unit:'백만', target:t.rev.target, actual:revDaily, fmt:'mil', diff:revDaily-t.rev.target, ach:revDaily/t.rev.target },
    gp:{ key:'gp', label:'매출익', unit:'백만', target:t.gp.target, actual:gpDaily, fmt:'mil', diff:gpDaily-t.gp.target, ach:gpDaily/t.gp.target },
    upi:{ key:'upi', label:'대당이익', unit:'만원', target:t.upi.target, actual:upiDaily, fmt:'man', diff:upiDaily-t.upi.target, ach:upiDaily/t.upi.target }
  };
  t.hit = Object.values(t.metrics).filter(m=>m.ach >= 1).length;
  t.totalScore = Object.values(t.metrics).reduce((a,m)=>a+m.ach,0);
});

const sortedTeams = [...DATA.teams].sort((a,b)=> b.hit-a.hit || b.totalScore-a.totalScore || b.metrics.gp.ach-a.metrics.gp.ach);
sortedTeams.forEach((t,i)=>t.rank=i+1);

const overallRevenueExpected = DATA.finance.revenueForecast * pace;
const overallGpExpected = DATA.finance.gpForecast * pace;
const totalAcqActual = sum(DATA.teams.map(t=>t.acq.actual));
const totalAcqTarget = sum(DATA.teams.map(t=>t.acq.target));
const totalAcqToday = sum(DATA.teams.map(t=>t.acq.today));
const overallUpi = overallGpExpected / totalAcqActual;

function gradeByAch(ach){
  if(ach >= 1) return 'g';
  if(ach >= 0.95) return 'w';
  return 'r';
}
function badgeByAch(ach){
  if(ach >= 1) return '<span class="badge ok">초과 '+pct0(ach-1)+'</span>';
  if(ach >= 0.95) return '<span class="badge warn">미달 '+pct0(1-ach)+'</span>';
  return '<span class="badge bad">미달 '+pct0(1-ach)+'</span>';
}
function fmt(metric, value){
  if(metric.fmt === 'num') return cm(value);
  if(metric.fmt === 'mil') return mil(value);
  if(metric.fmt === 'man') return man1(value);
  return cm(value);
}
function diffFmt(metric, value){
  if(metric.fmt === 'num') return diffNum(value);
  if(metric.fmt === 'mil') return diffMil(value);
  if(metric.fmt === 'man') return diffMan(value);
  return diffNum(value);
}
function clsFromAch(ach){ return ach>=1 ? 'ok' : (ach>=0.95 ? 'warn' : 'bad'); }

function kpiCard(title, value, unit, sub, ach){
  return `<div class="kpi ${clsFromAch(ach)}"><div class="t">${title}</div><div class="v">${value}<em>${unit}</em></div><div class="s">${sub}</div></div>`;
}

function scoreCell(metric){
  const cls = gradeByAch(metric.ach);
  const diff = diffFmt(metric, metric.diff);
  return `<div class="metricCell ${cls}"><span class="v">${fmt(metric, metric.actual)}</span><span class="d">${diff}</span></div>`;
}

function foldSection(title, sub, badge, inner, open=false){
  return `<details class="fold" ${open?'open':''}><summary><span class="ft">${title}</span><em class="fs">${sub||''}</em>${badge?`<span class="fb">${badge}</span>`:''}<span class="ar">▾</span></summary><div class="foldBody">${inner}</div></details>`;
}

function scoreTable(){
  const rows = sortedTeams.map((t,idx)=>{
    const hitCls = t.hit >= 3 ? 'g' : (t.hit === 2 ? 'w' : 'r');
    return `<tr class="${idx===0?'top1':''}">
      <td>
        <div class="tmline">
          <span class="rk">${idx===0?'👑':t.rank}</span>
          <div class="tmbox">
            <span class="nm">${t.name}</span>
            <span class="ow">${t.owner}</span>
          </div>
          <span class="hit ${hitCls}">${t.hit}/4</span>
        </div>
      </td>
      <td>${scoreCell(t.metrics.acq)}</td>
      <td>${scoreCell(t.metrics.rev)}</td>
      <td>${scoreCell(t.metrics.gp)}</td>
      <td>${scoreCell(t.metrics.upi)}</td>
    </tr>`;
  }).join('');

  const top2 = sortedTeams.slice(0,2).map(t=>`<span class="team">${t.name}</span><span class="desc">${t.hit}/4 달성 · ${t.metrics.gp.label} ${fmt(t.metrics.gp, t.metrics.gp.actual)}백만 / ${t.metrics.upi.label} ${fmt(t.metrics.upi, t.metrics.upi.actual)}만원</span>`).join('');
  const bottom2 = sortedTeams.slice(-2).reverse().map(t=>`<span class="team">${t.name}</span><span class="desc">${t.metrics.acq.label} ${fmt(t.metrics.acq, t.metrics.acq.actual)}대 · ${t.metrics.rev.label} 목표 대비 ${diffFmt(t.metrics.rev, t.metrics.rev.diff)}</span>`).join('');
  const leader = sortedTeams[0];
  const lagger = sortedTeams[sortedTeams.length-1];
  const oneLiner = `${leader.name}이 4개 지표 중 ${leader.hit}개를 달성하며 선두입니다. 반면 ${lagger.name}은 매입 ${fmt(lagger.metrics.acq, lagger.metrics.acq.actual)}대에도 매출 ${diffFmt(lagger.metrics.rev, lagger.metrics.rev.diff)}·대당이익 ${diffFmt(lagger.metrics.upi, lagger.metrics.upi.diff)}로 보완이 필요합니다.`;

  return `<section class="sec score">
    <div class="stitle"><h2>일간 팀별 성적표</h2><span class="sub">8월 누적 · 18영업일 기준 · 목표 대비 · 지표별 상세 요약</span></div>
    <table class="scoreTbl">
      <thead>
        <tr>
          <th>팀</th>
          <th>매입<br>대</th>
          <th>매출<br>백만</th>
          <th>매출익<br>백만</th>
          <th>대당이익<br>만원</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="scoreHero">${sortedTeams.map((t,i)=>`<span class="chip ${i===0?'first':''}"><span class="dot"></span><b>${i+1}위 ${t.name}</b>${t.hit}/4</span>`).join('')}</div>
    <div class="summaryGrid">
      <div class="sumBox good"><b>잘한 팀</b>${top2}</div>
      <div class="sumBox bad"><b>보완 필요</b>${bottom2}</div>
    </div>
    <div class="oneLine"><b>오늘 한줄</b><span>${oneLiner}</span></div>
  </section>`;
}

const COLORS = ['#7c4dbe','#1b8a6b','#c0392b','#5c7d99'];
function metricCard(metricKey, title, unit){
  const rows = [...DATA.teams].sort((a,b)=> b.metrics[metricKey].actual - a.metrics[metricKey].actual);
  const labels = rows.map(r=>r.name);
  const targetData = rows.map(r=> displayValue(r.metrics[metricKey].target, r.metrics[metricKey].fmt));
  const actualData = rows.map(r=> displayValue(r.metrics[metricKey].actual, r.metrics[metricKey].fmt));
  const id = 'chart_' + metricKey;
  const tableRows = rows.map((r,idx)=>{
    const m = r.metrics[metricKey];
    return `<tr class="${idx===0?'best':''}">
      <td>${idx+1}. ${r.name}</td>
      <td>${fmt(m,m.target)}</td>
      <td><b>${fmt(m,m.actual)}</b></td>
      <td class="${m.diff>=0?'pos':'neg'}">${diffFmt(m,m.diff)}</td>
      <td>${badgeByAch(m.ach)}</td>
    </tr>`;
  }).join('');
  const top = rows[0], topM = top.metrics[metricKey];
  const misses = rows.filter(r=>r.metrics[metricKey].ach < 1);
  const worst = [...rows].sort((a,b)=> a.metrics[metricKey].ach - b.metrics[metricKey].ach)[0];
  const worstM = worst.metrics[metricKey];
  const ai = misses.length === 0
    ? `4개 팀 전원 목표 달성. 1등 ${top.name} ${fmt(topM, topM.actual)}${unit}.`
    : `1등 ${top.name} ${fmt(topM, topM.actual)}${unit}(목표 대비 ${diffFmt(topM, topM.diff)}). ${misses.length}개 팀 미달, 최저 ${worst.name} ${badgeByAch(worstM.ach).replace(/<[^>]+>/g,'')}.`;
  return `<div class="dcard">
    <div class="hd"><h3>${title}</h3><span class="u">8월 누적 · ${unit}</span></div>
    <div class="cw"><canvas id="${id}"></canvas></div>
    <div class="tw">
      <table class="table">
        <thead><tr><th>순위 · 팀</th><th>목표</th><th>실적</th><th>차이</th><th>판정</th></tr></thead>
        <tbody>${tableRows}</tbody>
      </table>
    </div>
    <div class="ai"><span>해석</span>${ai}</div>
  </div>`;
}
function displayValue(v, fmtKey){
  if(fmtKey === 'num') return Math.round(v);
  if(fmtKey === 'mil') return Math.round(v/1e6);
  if(fmtKey === 'man') return +(v/10000).toFixed(1);
  return Math.round(v);
}

function makeChart(id, title, unit, labels, targetData, actualData, tickSuffix=''){
  const ctx = document.getElementById(id);
  if(!ctx) return;

  /* 주간보고형 차트 라벨: 막대값 + 팀별 판정 */
  const chartLabels = {
    id:'chartLabels_'+id,
    afterDatasetsDraw(chart){
      const {ctx, chartArea, scales} = chart;
      if(!chartArea || !scales.x) return;
      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      /* ① 각 팀 상단 판정 */
      labels.forEach((label, i)=>{
        const t = targetData[i];
        const a = actualData[i];
        if(t === null || t === undefined || !isFinite(t) || !t) return;
        const ach = a / t;
        const isOk = ach >= 1;
        const gap = Math.abs((ach - 1) * 100);
        const verdict = (isOk ? '초과 ' : '미달 ') + Math.round(gap) + '%';
        const x = scales.x.getPixelForValue(i);
        ctx.font = '800 10.5px "Pretendard Variable", Pretendard, sans-serif';
        ctx.fillStyle = isOk ? '#0e7c66' : '#c0392b';
        ctx.fillText(verdict, x, chartArea.top - 19);
      });

      /* ② 목표/실적 막대 바로 위 실제값 */
      chart.data.datasets.forEach((ds, dsIdx)=>{
        const meta = chart.getDatasetMeta(dsIdx);
        meta.data.forEach((bar, i)=>{
          const v = ds.data[i];
          if(v === null || v === undefined || !isFinite(v)) return;
          let label;
          if(unit === '만원') label = Number(v).toLocaleString('ko-KR',{minimumFractionDigits:1,maximumFractionDigits:1});
          else label = Math.round(v).toLocaleString('ko-KR');
          ctx.font = (dsIdx===1 ? '800' : '700') + ' 10.5px "Pretendard Variable", Pretendard, sans-serif';
          ctx.fillStyle = dsIdx===1 ? '#0f1a24' : '#8393a2';
          ctx.fillText(label, bar.x, Math.max(chartArea.top + 5, bar.y - 8));
        });
      });
      ctx.restore();
    }
  };

  new Chart(ctx, {
    type:'bar',
    data:{
      labels,
      datasets:[
        {label:'목표', data:targetData, backgroundColor:'rgba(197,206,214,0.95)', borderRadius:4, barPercentage:0.78, categoryPercentage:0.72},
        {label:'실적', data:actualData, backgroundColor:'rgba(14,124,102,0.95)', borderRadius:4, barPercentage:0.78, categoryPercentage:0.72}
      ]
    },
    options:{
      maintainAspectRatio:false,
      layout:{padding:{top:31,right:8,left:0,bottom:0}},
      plugins:{
        legend:{display:true, position:'bottom', align:'start', labels:{boxWidth:10, boxHeight:10, usePointStyle:false, font:{size:10}}},
        tooltip:{callbacks:{label:(ctx)=> `${ctx.dataset.label}: ${ctx.raw.toLocaleString('ko-KR')}${tickSuffix}`}}
      },
      scales:{
        x:{grid:{display:false}, ticks:{font:{size:10}, maxRotation:0, autoSkip:false}},
        y:{beginAtZero:true, grace:'12%', grid:{color:'#e3e8ed'}, ticks:{font:{size:10}, callback:(v)=> `${v.toLocaleString('ko-KR')}${tickSuffix}`}}
      }
    },
    plugins:[chartLabels]
  });
}

function metricSection(){
  const inner = `<section class="sec"><div class="stitle"><h2>지표별 상세</h2><span class="sub">차트 + 표 형식 유지</span><span class="unit">매입 · 매출 · 매출익 · 대당이익 · 매출/매출익은 18영업일 기준</span></div>
    <div class="grid2">
      ${metricCard('acq','매입','대')}
      ${metricCard('rev','매출','백만')}
      ${metricCard('gp','매출익','백만')}
      ${metricCard('upi','대당이익','만원')}
    </div>
  </section>`;
  return foldSection('지표별 상세','매입 · 매출 · 매출익 · 대당이익','차트+표',inner,false);
}

function acquisitionPart(){
  const cards = DATA.teams.map(t=>{
    const ach = t.metrics.acq.ach;
    const pct = Math.min(100, ach*100);
    const stateCls = gradeByAch(ach);
    const barColor = stateCls==='g' ? 'var(--ok)' : (stateCls==='w' ? 'var(--warn)' : 'var(--bad)');
    return `<div class="opCard">
      <div class="hd"><span class="nm">${t.name}</span><span class="sm">${t.owner}</span></div>
      <div class="main"><span class="v">${cm(t.acq.actual)}</span><span class="u">대</span><span class="sm ${t.metrics.acq.diff>=0?'pos':'neg'}">${diffFmt(t.metrics.acq, t.metrics.acq.diff)}</span></div>
      <div class="bar"><span style="width:${pct}%;background:${barColor}"></span></div>
      <div class="mini">
        <div><b>월 목표</b><span>${cm(t.acq.target)}</span></div>
        <div><b>당일</b><span>${cm(t.acq.today)}</span></div>
        <div><b>달성률</b><span>${pct1(ach)}</span></div>
      </div>
      <div class="break"><b>구성</b> 자사 매입 ${cm(t.acq.own)}대 · 출품 유도 ${cm(t.acq.induced)}대</div>
    </div>`;
  }).join('');
  const inner = `<section class="sec">
    <div class="stitle"><h2>Part 1. 매입·유도 대수</h2><span class="sub">법인영업 · 플랫폼매입 · 출품영업 · 경매운영</span><span class="unit">표 최소화 · 팀 카드형</span></div>
    <div class="partGrid">${cards}</div>
  </section>`;
  return foldSection('Part 1. 매입·유도 대수','법인영업 · 플랫폼매입 · 출품영업 · 경매운영','운영',inner,false);
}

      <div class="proc release"><div class="r"><span class="nm">반출</span><span class="val">${cm(r)}대</span><span class="rt">${pct1(rr)}</span></div><div class="bar"><span style="width:${Math.min(100,rr*100)}%"></span></div></div>
    </div>
    <div class="dayStrip">${labels.map((lb,i)=>`<div class="day"><b>${lb}</b><span>${cm(DATA.auction.settlement[i])}</span><em>정산</em></div>`).join('')}</div>
    <div class="dayStrip" style="margin-top:8px;">${labels.map((lb,i)=>`<div class="day"><b>${lb}</b><span>${cm(DATA.auction.release[i])}</span><em>반출</em></div>`).join('')}</div>

  return foldSection('Part 3. 경매처리',`${DATA.auction.owner} · 낙찰 ${cm(DATA.auction.won)}대`,'정산/반출',inner,false);
}
