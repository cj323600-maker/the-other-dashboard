<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>전략기획 ERP</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--ink:#141B22;--bg:#F3F5F8;--card:#fff;--mut:#5B6773;--line:#E2E7EC;--blue:#1F5FBF;--soft:#F1F5FA;--ok:#1E7B47;--okbg:#E6F4EA;--bad:#B3261E;--badbg:#FBE9E7;
--side:#14202B;--side2:#1C2B38;--sideTx:#C9D3DC;--sideMut:#7F8E9B;
--c-daily:#1F5FBF;--c-weekly:#1E7B47;--c-monthly:#6B3FA0;--c-member:#E07B39;--c-trend:#2F5D8A;--c-market:#0E7C86;--c-kmarket:#8A5A00;--c-matching:#B3423A;--c-check:#4B5563}
@media (prefers-color-scheme:dark){:root{--ink:#E6EBF0;--bg:#0E1318;--card:#172029;--mut:#98A4AF;--line:#26313B;--blue:#6E9EE8;--soft:#1C2733;--ok:#5CC48A;--okbg:#17321F;--bad:#F2928A;--badbg:#3A1C1A;--side:#0A0F14;--side2:#151E27}}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,"Malgun Gothic",sans-serif;font-variant-numeric:tabular-nums;word-break:keep-all;overflow-wrap:anywhere;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
/* 사이드바 */
.side{position:fixed;inset:0 auto 0 0;width:248px;background:var(--side);color:var(--sideTx);display:flex;flex-direction:column;z-index:30;transition:transform .2s}
.brand{display:flex;align-items:center;gap:10px;padding:22px 20px 18px}
.mark{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,#2F6FD6,#1C4E9E);display:grid;place-items:center;color:#fff;font-weight:900;font-size:17px;flex:0 0 auto}
.brand b{display:block;color:#fff;font-size:16px;font-weight:800;letter-spacing:-.01em}.brand small{font-size:11.5px;color:var(--sideMut)}
.nav{flex:1;overflow-y:auto;padding:6px 12px 12px}
.grp{font-size:11px;font-weight:700;color:var(--sideMut);letter-spacing:.06em;padding:16px 10px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;font-size:14.5px;font-weight:600;margin-bottom:2px;position:relative}
.nav a:hover{background:var(--side2);color:#fff}
.nav a.on{background:var(--side2);color:#fff}.nav a.on:before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--c,#6E9EE8)}
.nav svg{width:18px;height:18px;flex:0 0 auto;opacity:.85}
.nav .dot{margin-left:auto;width:7px;height:7px;border-radius:50%;background:#5CC48A}
.me{border-top:1px solid #24323F;padding:14px 20px 18px;display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:50%;background:#2A3A49;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px}
.me b{display:block;color:#fff;font-size:14px}.me small{font-size:11.5px;color:var(--sideMut)}
/* 본문 */
.main{margin-left:248px;min-height:100%;display:flex;flex-direction:column}
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:14px 32px}
.burger{display:none;width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--card)}
.burger svg{width:20px;height:20px}
.bar h1{margin:0;font-size:19px;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font-size:13px;color:var(--mut);white-space:nowrap}.chip b{color:var(--ink)}
.dday{display:inline-block;margin-left:6px;font-size:11.5px;font-weight:800;color:#fff;background:var(--blue);border-radius:6px;padding:2px 7px}
.page{padding:28px 32px 48px;max-width:1480px;width:100%}
.hero{background:linear-gradient(120deg,#163A6B,#1F5FBF 60%,#2E7BD8);color:#fff;border-radius:18px;padding:26px 28px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.hero .k{font-size:13px;opacity:.85}.hero h2{margin:6px 0 0;font-size:26px;font-weight:800;letter-spacing:-.02em}
.hero .s{font-size:13.5px;opacity:.9;margin-top:6px}
.hero a{background:#fff;color:#163A6B;font-weight:800;font-size:14px;padding:11px 18px;border-radius:10px;white-space:nowrap}
h3.sec{font-size:16px;font-weight:800;margin:30px 2px 14px;display:flex;justify-content:space-between;align-items:baseline;gap:4px 10px;flex-wrap:wrap}
h3.sec small{font-size:12.5px;font-weight:500;color:var(--mut)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-top:18px}@media (max-width:1180px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;min-width:0;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.kt{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13.5px;font-weight:700;color:var(--mut)}
.kv{font-size:36px;font-weight:800;letter-spacing:-.02em;margin-top:8px;line-height:1.15}.kv small{font-size:14px;font-weight:600;color:var(--mut);margin-left:4px}
.kd{font-size:12.5px;color:var(--mut);margin-top:6px}
.pill{font-size:11.5px;font-weight:700;border-radius:99px;padding:2px 9px;white-space:nowrap}
.ok{color:var(--ok)}.bad{color:var(--bad)}.pill.ok{background:var(--okbg)}.pill.bad{background:var(--badbg)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.mod{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;min-width:0;transition:transform .12s,box-shadow .12s;cursor:pointer}
.mod:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}.ic svg{width:20px;height:20px}
.mod h4{margin:0;font-size:17px;font-weight:800}
.upd{font-size:12px;color:var(--mut)}.upd.fresh{color:var(--ok);font-weight:700}
.mod .lt{font-size:14px;font-weight:700;line-height:1.45;overflow-wrap:anywhere}.mod .ls{font-size:12.5px;color:var(--mut);line-height:1.5;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mod .ft{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;color:var(--c);padding-top:6px;border-top:1px solid var(--line)}
.mod .ft span{color:var(--mut);font-weight:600}
/* 보고서 보기 */
.viewer{display:flex;flex-direction:column;height:calc(100vh - 67px)}
.vt{display:flex;align-items:center;gap:8px;padding:12px 32px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap}
.tab{padding:8px 14px;border-radius:8px;font-size:14px;font-weight:700;color:var(--mut)}.tab.on{background:var(--soft);color:var(--ink)}
.vt .sp{flex:1}.vt .meta{font-size:12.5px;color:var(--mut)}
.vt a.ext{font-size:13px;font-weight:700;border:1px solid var(--line);border-radius:8px;padding:7px 12px}
iframe{flex:1;width:100%;border:0;background:#fff}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.search{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit;font-size:15px}
.mon{margin-top:18px}.mon h5{font-size:13px;color:var(--mut);font-weight:700;margin:0 0 6px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px;padding:11px 6px;border-bottom:1px solid var(--line);border-radius:6px}.row:last-child{border-bottom:0}.row:hover{background:var(--soft)}
.row .d{flex:0 0 auto;font-size:13px;color:var(--mut);min-width:80px}.row .t{flex:1;min-width:0;font-size:15px;font-weight:600}
.badge{flex:0 0 auto;font-size:11px;font-weight:700;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--mut);text-transform:uppercase}
.new{flex:0 0 auto;font-size:11px;font-weight:700;color:#fff;background:var(--bad);border-radius:4px;padding:1px 6px}
.empty,.err{padding:16px 4px;font-size:14px;color:var(--mut)}.err{color:var(--bad)}
.foot{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--mut);line-height:1.8}
.scrim{display:none}
@media (max-width:1280px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:1024px){.side{transform:translateX(-100%)}.side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.4)}.main{margin-left:0}.burger{display:grid;place-items:center}
 .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}.grid{grid-template-columns:repeat(2,1fr)}.bar,.vt{padding-left:16px;padding-right:16px}.page{padding:20px 16px 40px}}
@media (max-width:760px){.kpis{grid-template-columns:1fr;gap:12px}.kv{font-size:28px}.grid{grid-template-columns:1fr;gap:12px}.hero{padding:20px}.hero h2{font-size:21px}.bar .chip.dt{display:none}.viewer{height:calc(100vh - 63px)}}
.kpi .kr{font-size:12.5px;color:var(--mut);margin-top:4px}.hero .stale{display:inline-block;margin-left:8px;background:#FDE8E7;color:#B42318;font-weight:800;font-size:12px;padding:2px 8px;border-radius:999px}
.cst{margin-left:auto;min-width:9px;height:9px;border-radius:999px;background:#22A06B;font-size:10px;font-weight:800;color:#fff;line-height:16px;text-align:center;animation:cpl 1.8s infinite}.cst.bad{min-width:18px;height:16px;padding:0 5px;background:#D92D20;animation-name:cpr}.cst.run{background:#9AA5B1}@keyframes cpl{0%{box-shadow:0 0 0 0 rgba(34,160,107,.6)}70%{box-shadow:0 0 0 7px rgba(34,160,107,0)}100%{box-shadow:0 0 0 0 rgba(34,160,107,0)}}@keyframes cpr{0%{box-shadow:0 0 0 0 rgba(217,45,32,.6)}70%{box-shadow:0 0 0 7px rgba(217,45,32,0)}100%{box-shadow:0 0 0 0 rgba(217,45,32,0)}}
.cban{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;border-radius:12px;padding:10px 16px;margin:0 0 14px;font-size:13px;text-decoration:none;color:inherit}.cban b{font-weight:800}.cban span{flex:1 1 280px;min-width:0;overflow-wrap:anywhere}.cban em{font-style:normal;font-size:12px;opacity:.85;white-space:nowrap}.cban.bad{background:#FDECEA;border:1px solid #F5B5AE;color:#8A1C12}.cban.ok{background:#E9F6EE;border:1px solid #BFE3CC;color:#1E5E3A;padding:7px 14px}.cban.run{background:#EEF2F5;color:#5B6876;padding:7px 14px}
</style>
</head>
<body>
<aside class="side" id="side">
  <div class="brand"><div class="mark">K</div><div><b>전략기획 ERP</b><small>코오롱오토옥션 전략기획팀</small></div></div>
  <nav class="nav" id="nav"></nav>

  <main id="view"></main>
</div>
<script>
(function(){
"use strict";
var CFG={owner:"cj323600-maker",repo:"the-other-dashboard",branch:"main"};
var h=location.hostname;
if(/\.github\.io$/.test(h)){CFG.owner=h.split(".")[0];var seg=location.pathname.split("/").filter(Boolean);if(seg.length&&!/\.html?$/.test(seg[0]))CFG.repo=seg[0];}
var I={
 home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 day:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/>',
 week:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 14h6"/>',
 month:'<path d="M5 20V10M10 20V4M15 20v-7M20 20v-11"/>',
 member:'<circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0M16 11a3 3 0 1 0 0-6M21 20a6 6 0 0 0-4-5.6"/>',

 globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
 market:'<path d="M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6"/>',
 file:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 14l2 2 4-4"/>',
 check:'<path d="M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>',
 grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>'};
var ico=function(k){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+I[k]+'</svg>';};
var MODS=[
  {key:"daily",  grp:"보고",name:"일간보고",          dir:"daily",  src:"Daily-dashboard",   c:"var(--c-daily)",  ic:"day"},
  {key:"weekly", grp:"보고",name:"주간보고",          dir:"weekly", src:"week-dashboard",    c:"var(--c-weekly)", ic:"week"},
  {key:"monthly",grp:"보고",name:"월간보고",          dir:"monthly",src:"Month-dashboard",   c:"var(--c-monthly)",ic:"month"},
  {key:"member", grp:"분석",name:"회원사 분석",       dir:"member", src:"Country-dashboard", c:"var(--c-member)", ic:"member", subSel:"small"},
  {key:"trend",  grp:"분석",name:"출품 및 낙찰 추이", dir:"trend",  src:"Auction-dashboard", c:"var(--c-trend)",  ic:"trend"},
  {key:"matching",grp:"분석",name:"매칭 테이블",      dir:"matching",self:true,             c:"var(--c-matching)",ic:"grid", subSel:".sub"},
  {key:"market", grp:"시장",name:"수출시장 환경모니터",dir:"market", self:true,              c:"var(--c-market)", ic:"globe", subSel:".hd p"},
  {key:"kmarket",grp:"시장",name:"국내 경매장 시장", dir:"kmarket",self:true,              c:"var(--c-kmarket)",ic:"market",subSel:".sub"},
  {key:"check",  grp:"관리",name:"보고서 점검 프로그램",dir:"check",  self:true,              c:"var(--c-check)",  ic:"check", subSel:".sub", noList:true},
  {key:"precheck",grp:"관리",name:"원천 파일 사전 점검기",dir:"precheck",self:true,           c:"var(--c-check)",  ic:"file",  subSel:".sub", noList:true}
];
var BY={};MODS.forEach(function(m){BY[m.key]=m;});
var VIEWABLE=/\.(html?|pdf|png|jpe?g|gif|svg|webp|txt|md)$/i,NEW_DAYS=3,now=new Date(),WK="일월화수목금토";
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function pad(n){return(n<10?"0":"")+n;}
function md(d){return(d.getMonth()+1)+"/"+d.getDate()+"("+WK[d.getDay()]+")";}
function txt(el){return el?el.textContent.replace(/\s+/g," ").trim():"";}
document.getElementById("today").innerHTML="<b>"+now.getFullYear()+"."+pad(now.getMonth()+1)+"."+pad(now.getDate())+" ("+WK[now.getDay()]+")</b>";
var AUC=null;
function renderAuction(t){
  var d=null,m=t&&t.match(/경매일\s*(\d{1,2})\/(\d{1,2})/),t0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  if(m){d=new Date(now.getFullYear(),+m[1]-1,+m[2]);if(d<t0)d=null;}
  if(!d){d=new Date(t0);d.setDate(d.getDate()+((3-d.getDay()+7)%7));}
  var dd=0,x=new Date(t0);while(x<d){x.setDate(x.getDate()+1);var wd=x.getDay();if(wd!==0&&wd!==6)dd++;}AUC={d:d,dd:dd};// 2026-11-14: D-n은 일보와 같은 영업일(주말 제외) 기준
  document.getElementById("auction").innerHTML="다음 경매 <b>"+md(d)+"</b><span class=\"dday\">"+(dd===0?"D-DAY":"D-"+dd)+"</span>";
}
renderAuction("");
function parse(path){
  var file=path.split("/").pop(),ext=(file.match(/\.([^.]+)$/)||["",""])[1].toLowerCase(),base=file.replace(/\.[^.]+$/,"");
  var m=base.match(/^(\d{4})[-.]?(\d{2})(?:[-.]?(\d{2}))?(?:[_\s-]+(.*))?$/),y=null,mo=null,d=null,title=base.replace(/_/g," ");
  if(m){var mm=+m[2],dd=m[3]?+m[3]:null;if(mm>=1&&mm<=12&&(dd===null||(dd>=1&&dd<=31))){y=+m[1];mo=mm;d=dd;title=(m[4]||"").replace(/_/g," ").trim()||base;}}
  return{path:path,file:file,ext:ext,title:title,y:y,mo:mo,d:d,sortKey:y?(y*10000+mo*100+(d||0)):0,label:y?(y+"."+pad(mo)+(d?"."+pad(d):"")):"날짜 미지정",ts:y?new Date(y,mo-1,d||1).getTime():0};
}
function href(path){return path.split("/").map(encodeURIComponent).join("/");}
var CACHE_KEY="erp_tree_v1",CACHE_MS=5*60*1000;
function loadTree(){
  try{var c=JSON.parse(sessionStorage.getItem(CACHE_KEY)||"null");if(c&&Date.now()-c.t<CACHE_MS)return Promise.resolve(c.paths);}catch(e){}
  return fetch("https://api.github.com/repos/"+CFG.owner+"/"+CFG.repo+"/git/trees/"+CFG.branch+"?recursive=1",{headers:{Accept:"application/vnd.github+json"}}).then(function(r){
    if(!r.ok)throw new Error(r.status===403?"GitHub 조회 한도 초과 (잠시 후 새로고침)":"목록 조회 실패 ("+r.status+")");return r.json();
  }).then(function(j){var p=(j.tree||[]).filter(function(t){return t.type==="blob";}).map(function(t){return t.path;});try{sessionStorage.setItem(CACHE_KEY,JSON.stringify({t:Date.now(),paths:p}));}catch(e){}return p;});
}
var DATA=null,ERR=null,LIVE={},KPI=null;
function liveUrl(m){if(m.self)return m.dir+"/";return(/\.github\.io$/.test(h)?"/":"https://"+CFG.owner+".github.io/")+m.src+"/";}
function ago(t){if(!t)return"";var s=(now-t)/1000,x=new Date(t);var rel=s<3600?Math.max(1,Math.round(s/60))+"분 전":s<86400?Math.round(s/3600)+"시간 전":Math.round(s/86400)+"일 전";return md(x)+" "+pad(x.getHours())+":"+pad(x.getMinutes())+" · "+rel;}
function fresh(m){var v=LIVE[m.key];return v&&v.lm&&(now-v.lm)<36*3600000;}
function loadLive(m){
  return fetch(liveUrl(m)+"?t="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;var lm=Date.parse(r.headers.get("last-modified")||"");return r.text().then(function(t){return[t,lm];});})
  .then(function(a){var doc=new DOMParser().parseFromString(a[0],"text/html");var st=txt(doc.querySelector(m.subSel||".sub")).replace(/\[대외비\]/g,"").trim();if(st.length>90)st=st.slice(0,90)+"…";
    LIVE[m.key]={title:(doc.title||m.name).trim(),sub:st,lm:isNaN(a[1])?0:a[1]};if(m.key==="daily"){renderAuction(st);KPI=readKpi(doc);}})
  .catch(function(){LIVE[m.key]={title:m.name+" 최신본",sub:"",lm:0};});
}
// 카드 회색 글씨: 보고서별 핵심 한 줄(2026-11-11)
function brief(m,st){
  if(!st)return"";var x;
  if(m.key==="daily"&&(x=st.match(/기준일\s*(\d{4})\.(\d{2})\.(\d{2})\s*\((.)\).*?(D-\d+|경매일)\s*$/)))return"기준일 "+(+x[2])+"/"+(+x[3])+"("+x[4]+") · "+(x[5]==="경매일"?"경매일":"경매 "+x[5]);
  if(m.key==="weekly"&&(x=st.match(/(\d{1,2}월\s*\d주차).*?경매\s*([\d/]+\(.\))/)))return x[1]+" · 경매 "+x[2];
  if(m.key==="monthly"&&(x=st.match(/(\d{1,2}월)\s*마감.*?경매\s*(\d+회)/)))return x[1]+" 마감 · 경매 "+x[2];
  if(m.key==="trend"&&(x=st.match(/(\d{4})년\s*(\d{1,2})월\s*~\s*(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일.*?(\d+회차)/)))return x[1].slice(2)+"."+x[2]+" ~ "+x[3].slice(2)+"."+x[4]+"."+x[5]+" · "+x[6];
  if(m.key==="member"&&(x=st.match(/수출\s*([\d,]+)개사\s*·\s*내수\s*([\d,]+)개사.*?(\d{1,2}\/\d{1,2})\s*~\s*(\d{1,2}\/\d{1,2})/)))return"수출 "+x[1]+" · 내수 "+x[2]+"개사 · "+x[3]+"~"+x[4];
  if(m.key==="market"&&(x=st.match(/확인 기준일\s*(\d{4})\.(\d{2})\.(\d{2})/)))return"규제 확인 "+(+x[2])+"/"+(+x[3]);
  if(m.key==="matching"&&(x=st.match(/(최근|전체)\s*(\d+)회차\(([\d\/]+)~([\d\/]+)\).*?낙찰률\s*([\d.]+%)/)))return x[1]+" "+x[2]+"회차 · "+x[3]+"~"+x[4]+" · 낙찰률 "+x[5];
  if(m.key==="kmarket"&&(x=st.match(/(\d{4})년\s*(\d{1,2})월\s*~\s*(\d{4})년\s*(\d{1,2})월/)))return"협회 9개사 · "+x[1].slice(2)+"."+x[2]+" ~ "+x[3].slice(2)+"."+x[4];
  return st.split("·")[0].trim().slice(0,28);
}
function readKpi(doc){
  var out=[];doc.querySelectorAll(".kpis .card").forEach(function(c){
    var pill=c.querySelector(".pill"),cv=c.querySelector(".cv");if(!cv)return;var cd=c.querySelector(".cd"),b=cd&&cd.querySelector("b");
    var rm=txt(c).match(/범위\s*([\d,.]+~[\d,.]+\s*(?:대|억원))\s*\(±([\d.]+)%/),hm=txt(c).match(/최근 (\d+)(회차|주) 중 (\d+)회 적중/),rg=rm?rm[1]+" (±"+rm[2]+"%)":"";
    out.push({rg:rg,lab:txt(c.querySelector(".ct > span")),pill:txt(pill),ok:!!(pill&&/v-ok/.test(pill.className)),v:txt(cv.querySelector("span")),unit:txt(cv.querySelector("small")),d:txt(b)+" "+(cd?txt(cd).replace(txt(b),"").split("·")[0].trim():"")});
  });
  // 2026-11-14: 일보 "재고 자산 현황" 섹션을 네 번째 카드로(달성/미달 판정 없음)
  var h=[].filter.call(doc.querySelectorAll("h2"),function(e){return /^재고 자산 현황/.test(txt(e));})[0];
  if(h&&out.length){var s=txt(h),m=s.match(/ERP 재고\s*([\d,]+)대\s*·\s*([\d,.]+)억원\(매입원가,\s*([^)]*?)\s*기준\)\s*·\s*이번 회차 출품\s*([\d,]+)대\s*·\s*([\d,.]+)억원/),
    f=(txt(h.parentNode).match(/재무 재고 평가액\((\d+\/\d+)\)\s*([\d,.]+)억원/)||[]);
    if(m)out.push({inv:true,lab:"재고 자산 (ERP 매입원가)",pill:"",v:m[2],unit:"억원",d:m[1]+"대 · "+m[3]+" 기준 · 이번 회차 출품 "+m[4]+"대 · "+m[5]+"억원",rg:f[2]?"":"",fin:f[2]?("재무 재고 평가액("+f[1]+") "+f[2]+"억원"):""});}
  return out.length?out:null;
}
function group(paths){var o={};MODS.forEach(function(m){o[m.key]=paths.filter(function(p){if(p.indexOf(m.dir+"/")!==0)return false;var f=p.split("/").pop();return f.charAt(0)!=="."&&!/^readme\.md$/i.test(f)&&f!=="index.html";}).map(parse).sort(function(a,b){return b.sortKey-a.sortKey||a.file.localeCompare(b.file,"ko");});});return o;}
function isNew(it){return it.ts&&(now.getTime()-it.ts)<NEW_DAYS*86400000&&it.ts<=now.getTime();}
var NAVCUR="home";function renderNav(cur){NAVCUR=cur;
  var html='<a href="#home" class="'+(cur==="home"?"on":"")+'">'+ico("home")+'홈</a>',g=null;
  MODS.forEach(function(m){if(m.grp!==g){g=m.grp;html+='<div class="grp">'+g+'</div>';}
    html+='<a href="#'+m.key+'" class="'+(cur===m.key?"on":"")+'" style="--c:'+m.c+'">'+ico(m.ic)+esc(m.name)+(m.key==="check"?chkBadge():(fresh(m)&&!m.noList?'<span class="dot" title="36시간 이내 갱신"></span>':''))+'</a>';});
  document.getElementById("nav").innerHTML=html;

function renderHome(){
  document.getElementById("ttl").textContent="홈";
  var lv=LIVE.daily,dl=lv&&lv.sub?lv.sub.split("·").slice(0,3).join("·"):"",up=MODS.filter(function(m){return !m.noList&&fresh(m);});
  var bd=(lv&&lv.sub.match(/기준일\s*(\d{4})\.(\d{2})\.(\d{2})/))||null,stale="";

  var html='<div class="page">'+chkBanner()+'<section class="hero"><div><div class="k">일간보고 최신본'+stale+'</div><h2>'+esc(lv?lv.title:"전략기획 ERP")+'</h2><div class="s">'+esc(dl)+'</div></div><a href="#daily">일간보고 보기 →</a></section><div class="kpis">';
  if(KPI){KPI.forEach(function(k){html+='<a class="kpi" href="#daily"><div class="kt"><span>'+esc(k.lab)+'</span>'+(k.pill?'<span class="pill '+(k.ok?"ok":"bad")+'">'+esc(k.pill.replace("주 목표 대비 달성률","달성률"))+'</span>':'')+'</div><div class="kv"><span class="'+(k.inv?"":(k.ok?"ok":"bad"))+'">'+esc(k.v)+'</span><small>'+esc(k.unit)+'</small></div><div class="kd">'+esc(k.d)+'</div>'+(k.rg?'<div class="kr">예상 범위 '+esc(k.rg)+'</div>':'')+(k.fin?'<div class="kr">'+esc(k.fin)+'</div>':'')+'</a>';});}
  else{for(var i=0;i<3;i++)html+='<div class="kpi"><div class="kv" style="font-size:16px;color:var(--mut)">'+(LIVE.daily?"표시할 항목 없음":"불러오는 중")+'</div></div>';}
  html+='</div><h3 class="sec"><span>보고서와 분석</span><small>'+(up.length?"최근 36시간 갱신 "+up.map(function(m){return m.name;}).join(" · "):"최신본 기준")+'</small></h3><div class="grid">';
  MODS.forEach(function(m){if(m.noList)return;// 2026-11-14: 관리 메뉴(보고서 점검)는 홈 카드에서 제외
    var v=LIVE[m.key],list=DATA?DATA[m.key]:null;
    html+='<a class="mod" href="#'+m.key+'" style="--c:'+m.c+'"><div class="ic">'+ico(m.ic)+'</div><div><h4>'+esc(m.name)+'</h4><div class="upd'+(fresh(m)?" fresh":"")+'">'+(v&&v.lm?"업데이트 "+esc(ago(v.lm)):"")+'</div></div>'
      +'<div><div class="lt">'+esc(v?(brief(m,v.sub)||v.title):"불러오는 중")+'</div></div><div class="ft">열기 →<span>'+(m.noList?"열 때마다 자동 대조":"지난 보고서 "+(list?list.length:"-")+"건")+'</span></div></a>';});
  html+='</div>'+(ERR?'<div class="panel err" style="margin-top:16px">지난 보고서 목록: '+esc(ERR)+'</div>':'')
    +'<div class="foot">코오롱오토옥션 전략기획팀 · 최신본은 각 보고서 저장소 업데이트 시 자동 반영 · 지난 보고서는 메뉴별 보관 폴더에 날짜_제목.html 형식으로 보관</div></div>';
  document.getElementById("view").innerHTML=html;
}
function renderModule(m,sub){
  document.getElementById("ttl").textContent=m.name;
  var v=LIVE[m.key],list=DATA?DATA[m.key]:null,isList=sub==="list",file=sub&&sub.indexOf("f=")===0?decodeURIComponent(sub.slice(2)):null;
  var src=file?href(file):liveUrl(m)+"?v="+((v&&v.lm)||Date.now())+(sub&&sub.indexOf("r=")===0?"#"+sub:""),it=file&&list?list.filter(function(x){return x.path===file;})[0]:null;
  var tabs='<div class="vt" style="--c:'+m.c+'"><a class="tab'+(!isList&&!file?" on":"")+'" href="#'+m.key+'">'+(m.noList?"점검 결과":"최신본")+'</a>'+(m.noList?'':'<a class="tab'+(isList||file?" on":"")+'" href="#'+m.key+'/list">지난 보고서'+(list?" "+list.length:"")+'</a>')+'<span class="sp"></span>'
    +(isList?'':'<span class="meta">'+esc(file?(it?it.label+" · "+it.title:file):(v&&v.lm?"업데이트 "+ago(v.lm):""))+'</span><a class="ext" href="'+src+'" target="_blank" rel="noopener">새 창 ↗</a>')+'</div>';
  if(!isList){document.getElementById("view").innerHTML='<div class="viewer">'+tabs+'<iframe src="'+src+'" title="'+esc(m.name)+'"></iframe></div>';return;}
  document.getElementById("view").innerHTML='<div class="viewer" style="height:auto">'+tabs+'</div><div class="page"><div class="panel"><input class="search" id="q" type="search" placeholder="지난 보고서 검색 (예: 2026-11, 10월)" autocomplete="off"><div id="list"></div></div></div>';
  var q=document.getElementById("q");
  function draw(){var box=document.getElementById("list");if(ERR){box.innerHTML='<div class="err">'+esc(ERR)+'</div>';return;}if(!DATA){box.innerHTML='<div class="empty">불러오는 중</div>';return;}
    var kw=q.value.trim().toLowerCase().replace(/[-.]/g,"");var items=DATA[m.key].filter(function(it){return!kw||(it.title+" "+it.label+" "+it.file).toLowerCase().replace(/[-.]/g,"").indexOf(kw)>=0;});
    if(!items.length){box.innerHTML='<div class="empty">'+(kw?"검색 결과가 없습니다.":"보관된 지난 보고서가 없습니다.")+'</div>';return;}
    var html="",cur=null;items.forEach(function(it){var g=it.y?it.y+"년 "+it.mo+"월":"날짜 미지정";if(g!==cur){if(cur!==null)html+="</div>";html+='<div class="mon"><h5>'+g+'</h5>';cur=g;}
      var a=VIEWABLE.test(it.file)?'href="#'+m.key+'/f='+encodeURIComponent(it.path)+'"':'href="'+href(it.path)+'" download';
      html+='<a class="row" '+a+'><span class="d">'+esc(it.label)+'</span><span class="t">'+esc(it.title)+'</span>'+(isNew(it)?'<span class="new">NEW</span>':'')+'<span class="badge">'+esc(it.ext||"file")+'</span></a>';});
    box.innerHTML=html+"</div>";}
  q.addEventListener("input",draw);draw();
}
var lastRoute="";
function route(force){
  var hs=(location.hash||"#home").slice(1),parts=hs.split("/"),key=parts[0],sub=parts.slice(1).join("/"),m=BY[key];
  renderNav(m?key:"home");
  if(!force&&hs===lastRoute&&m&&!(sub==="list"))return; // 보고서 보는 중에는 데이터 갱신으로 iframe을 다시 그리지 않음
  lastRoute=hs; if(m)renderModule(m,sub);else renderHome();
}
var side=document.getElementById("side"),scrim=document.getElementById("scrim");
function menu(o){side.classList.toggle("open",o);scrim.classList.toggle("open",o);}
document.getElementById("burger").onclick=function(){menu(!side.classList.contains("open"));};scrim.onclick=function(){menu(false);};
window.addEventListener("hashchange",function(){menu(false);route(true);window.scrollTo(0,0);});
route(true);
function selfTime(m){// 2026-11-14: 포털 저장소 안 메뉴는 배포 때마다 Last-Modified가 함께 바뀌므로 그 파일의 마지막 커밋 시각을 씀
  var ck="erp_ct_"+m.key;try{var c=JSON.parse(sessionStorage.getItem(ck)||"null");if(c&&Date.now()-c.t<CACHE_MS)return Promise.resolve(c.v);}catch(e){}
  return fetch("https://api.github.com/repos/"+CFG.owner+"/"+CFG.repo+"/commits?path="+encodeURIComponent(m.dir+"/index.html")+"&sha="+CFG.branch+"&per_page=1",{headers:{Accept:"application/vnd.github+json"}})
   .then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(j){var v=j&&j[0]?Date.parse(j[0].commit.committer.date):0;try{sessionStorage.setItem(ck,JSON.stringify({t:Date.now(),v:v}));}catch(e){}return v;}).catch(function(){return 0;});
}
var CHK=null,CHKBUSY=false;
function chkBadge(){if(CHKBUSY&&!CHK)return'<span class="cst run" title="점검 중"></span>';if(!CHK)return'';var b=CHK.c.bad+(CHK.err.length?1:0),d=new Date(CHK.at);
  return'<span class="cst '+(b?"bad":"ok")+'" title="실시간 작동 중 · 마지막 점검 '+pad(d.getHours())+":"+pad(d.getMinutes())+(b?" · 불일치 · 갱신 필요 "+b+"건":" · 이상 없음")+'">'+(b?b:"")+'</span>';}
// 2026-11-14 홈 경고 표시: 보고서 점검 결과 불일치 · 갱신 필요가 있으면 홈 맨 위에 빨간 경고, 없으면 얇은 초록 줄
function chkBanner(){if(!CHK)return CHKBUSY?'<div class="cban run">보고서 점검 중…</div>':'';var it=CHK.F.concat(CHK.R).filter(function(x){return x.j==="bad";}).map(function(x){return x.t;}).concat(CHK.err.map(function(e){return e+" 불러오기 실패";})),d=new Date(CHK.at),tm=pad(d.getHours())+":"+pad(d.getMinutes());
  if(it.length)return'<a class="cban bad" href="#check"><b>보고서 점검 경고 · 불일치 · 갱신 필요 '+it.length+'건</b><span>'+esc(it.join(" · "))+'</span><em>마지막 점검 '+tm+' · 보고서 점검 프로그램 열기 →</em></a>';
  return'<a class="cban ok" href="#check"><b>보고서 점검 이상 없음</b><span>'+(CHK.c.ok+CHK.c.info)+'건 중 '+CHK.c.ok+'건 일치 · 최신'+(CHK.c.wait?' · 갱신 대기 '+CHK.c.wait+'건':'')+'</span><em>마지막 점검 '+tm+'</em></a>';}
function runChk(){if(!window.RCHECK||CHKBUSY)return;CHKBUSY=true;renderNav(NAVCUR);RCHECK.run(RCHECK.browserGet,new Date()).then(function(x){CHK=x;CHKBUSY=false;renderNav(NAVCUR);if(NAVCUR==="home")renderHome();},function(){CHKBUSY=false;renderNav(NAVCUR);});}
(function(){var s=document.createElement("script");s.src="check/engine.js";s.onload=function(){runChk();setInterval(runChk,10*60*1000);};document.head.appendChild(s);})();
