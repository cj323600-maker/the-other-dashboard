<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>전략기획 ERP</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--ink:#141B22;--navy:#1C2E3B;--bg:#F4F6F8;--card:#fff;--mut:#5B6773;--line:#DDE3E8;--blue:#1F5FBF;--soft:#EEF3FA;--bad:#B3261E;
--c-daily:#1F5FBF;--c-weekly:#1E7B47;--c-monthly:#6B3FA0;--c-member:#E07B39;--c-trend:#2F5D8A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#E6EBF0;--navy:#9FB4C6;--bg:#11161B;--card:#1A2129;--mut:#98A4AF;--line:#2C3640;--blue:#6E9EE8;--soft:#1E2A38;--bad:#F2928A}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,"Malgun Gothic",sans-serif;font-variant-numeric:tabular-nums;word-break:keep-all;overflow-wrap:anywhere;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 48px}
.top{background:var(--card);border:1px solid var(--line);border-bottom:3px solid var(--blue);border-radius:10px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.top .sub{font-size:13px;color:var(--mut);margin-top:3px}
.top .today{font-size:13px;color:var(--mut);white-space:nowrap}
nav.tabs{display:flex;gap:6px;margin:14px 0 4px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:0 0 auto;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:600;color:var(--mut);white-space:nowrap}
nav.tabs a.on{background:var(--blue);border-color:var(--blue);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:14px}
.mod{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.mod h2{margin:0;font-size:17px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:8px}
.mod h2 small{font-size:12px;font-weight:600;color:var(--mut)}
.mod .desc{font-size:13px;color:var(--mut);margin:0}
.latest{background:var(--soft);border-radius:8px;padding:10px 12px;font-size:13.5px;min-height:58px}
.latest .lb{font-size:11.5px;color:var(--mut);font-weight:600}
.latest .lt{font-weight:700;margin-top:2px}
.btns{display:flex;gap:8px;margin-top:auto}
.btn{flex:1;text-align:center;padding:9px 10px;border-radius:8px;font-size:14px;font-weight:700;border:1px solid var(--line);background:var(--card)}
.btn.pri{background:var(--c);border-color:var(--c);color:#fff}
.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px}
.panel h2{margin:0 0 4px;font-size:19px;font-weight:800}
.panel .desc{font-size:13px;color:var(--mut);margin:0 0 12px}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:15px}
.mon{margin-top:16px}
.mon h3{font-size:13px;color:var(--mut);font-weight:700;margin:0 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row:hover{background:var(--soft)}
.row .d{flex:0 0 auto;font-size:13px;color:var(--mut);min-width:78px}
.row .t{flex:1;min-width:0;font-size:15px;font-weight:600}
.badge{flex:0 0 auto;font-size:11px;font-weight:700;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--mut);text-transform:uppercase}
.new{flex:0 0 auto;font-size:11px;font-weight:700;color:#fff;background:var(--bad);border-radius:4px;padding:1px 6px}
.empty,.err{padding:18px 4px;font-size:14px;color:var(--mut)}
.err{color:var(--bad)}
.rule{margin-top:18px;font-size:12.5px;color:var(--mut);line-height:1.7;background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:12px 14px}
.rule code{background:var(--soft);padding:1px 5px;border-radius:4px;font-size:12px}
@media (max-width:480px){.top h1{font-size:19px}.grid{grid-template-columns:1fr}.row .d{min-width:70px;font-size:12px}.row .t{font-size:14px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>전략기획 ERP</h1>
      <div class="sub">코오롱오토옥션 전략기획팀 · 보고 및 대시보드 통합 관리</div>
    </div>
    <div class="today" id="today"></div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="view"></main>
  <div class="rule">
    업로드 규칙: 메뉴별 폴더에 <code>날짜_제목.확장자</code> 형식으로 올리면 자동으로 목록에 표시됩니다.<br>
    폴더 <code>daily</code> 일간보고 · <code>weekly</code> 주간보고 · <code>monthly</code> 월간보고 · <code>member</code> 회원사 낙찰추이 · <code>trend</code> 출품 및 낙찰 추이<br>
    날짜 표기 <code>2026-11-10</code>(일 단위) 또는 <code>2026-11</code>(월 단위) · 예) <code>daily/2026-11-10_일간보고.html</code>
  </div>
</div>
<script>
(function(){
"use strict";
// 저장소 설정: GitHub Pages 주소에서 자동 판별, 그 외 환경은 기본값 사용
var CFG={owner:"cj323600-maker",repo:"the-other-dashboard",branch:"main"};
var h=location.hostname;
if(/\.github\.io$/.test(h)){CFG.owner=h.split(".")[0];var seg=location.pathname.split("/").filter(Boolean);if(seg.length&&!/\.html?$/.test(seg[0]))CFG.repo=seg[0];}

var MODS=[
  {key:"daily",  name:"일간보고",          dir:"daily",  c:"var(--c-daily)",  desc:"매일 작성하는 일간보고"},
  {key:"weekly", name:"주간보고",          dir:"weekly", c:"var(--c-weekly)", desc:"주 단위 실적 및 이슈 보고"},
  {key:"monthly",name:"월간보고",          dir:"monthly",c:"var(--c-monthly)",desc:"월 마감 실적 보고"},
  {key:"member", name:"회원사 낙찰추이",   dir:"member", c:"var(--c-member)", desc:"회원사별 낙찰 실적 추이"},
  {key:"trend",  name:"출품 및 낙찰 추이", dir:"trend",  c:"var(--c-trend)",  desc:"회차별 출품·낙찰 대시보드"}
];
var VIEWABLE=/\.(html?|pdf|png|jpe?g|gif|svg|webp|txt|md)$/i;
var NEW_DAYS=3;

var now=new Date();
var WK="일월화수목금토";
document.getElementById("today").textContent=now.getFullYear()+"년 "+(now.getMonth()+1)+"월 "+now.getDate()+"일 ("+WK[now.getDay()]+")";

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function pad(n){return(n<10?"0":"")+n;}

// 파일명 해석: 2026-11-10_제목.html / 20261110_제목.html / 2026-11_제목.html
function parse(path){
  var file=path.split("/").pop();
  var ext=(file.match(/\.([^.]+)$/)||["",""])[1].toLowerCase();
  var base=file.replace(/\.[^.]+$/,"");
  var m=base.match(/^(\d{4})[-.]?(\d{2})(?:[-.]?(\d{2}))?(?:[_\s-]+(.*))?$/);
  var y=null,mo=null,d=null,title=base;
  if(m){
    var yy=+m[1],mm=+m[2],dd=m[3]?+m[3]:null;
    if(mm>=1&&mm<=12&&(dd===null||(dd>=1&&dd<=31))){y=yy;mo=mm;d=dd;title=(m[4]||"").replace(/_/g," ").trim()||base;}
  }else{title=base.replace(/_/g," ");}
  var sortKey=y?(y*10000+mo*100+(d||0)):0;
  var label=y?(y+"."+pad(mo)+(d?"."+pad(d):"")):"날짜 미지정";
  var ts=y?new Date(y,mo-1,d||1).getTime():0;
  return{path:path,file:file,ext:ext,title:title,y:y,mo:mo,d:d,sortKey:sortKey,label:label,ts:ts};
}
function href(path){return path.split("/").map(encodeURIComponent).join("/");}

var CACHE_KEY="erp_tree_v1",CACHE_MS=5*60*1000;
function loadTree(){
  try{var c=JSON.parse(sessionStorage.getItem(CACHE_KEY)||"null");if(c&&Date.now()-c.t<CACHE_MS)return Promise.resolve(c.paths);}catch(e){}
  var url="https://api.github.com/repos/"+CFG.owner+"/"+CFG.repo+"/git/trees/"+CFG.branch+"?recursive=1";
  return fetch(url,{headers:{Accept:"application/vnd.github+json"}}).then(function(r){
    if(!r.ok)throw new Error(r.status===403?"GitHub 조회 한도 초과 (잠시 후 새로고침)":"목록 조회 실패 ("+r.status+")");
    return r.json();
  }).then(function(j){
    var paths=(j.tree||[]).filter(function(t){return t.type==="blob";}).map(function(t){return t.path;});
    try{sessionStorage.setItem(CACHE_KEY,JSON.stringify({t:Date.now(),paths:paths}));}catch(e){}
    return paths;
  });
}

var DATA=null,ERR=null;
function group(paths){
  var out={};
  MODS.forEach(function(m){
    out[m.key]=paths.filter(function(p){
      if(p.indexOf(m.dir+"/")!==0)return false;
      var f=p.split("/").pop();
      return f.charAt(0)!=="."&&!/^readme\.md$/i.test(f);
    }).map(parse).sort(function(a,b){return b.sortKey-a.sortKey||a.file.localeCompare(b.file,"ko");});
  });
  return out;
}
function isNew(it){return it.ts&&(now.getTime()-it.ts)<NEW_DAYS*86400000&&it.ts<=now.getTime();}

function renderTabs(cur){
  var html='<a href="#home" class="'+(cur==="home"?"on":"")+'">홈</a>';
  MODS.forEach(function(m){html+='<a href="#'+m.key+'" class="'+(cur===m.key?"on":"")+'">'+esc(m.name)+'</a>';});
  document.getElementById("tabs").innerHTML=html;
  var on=document.querySelector("nav.tabs a.on");if(on&&on.scrollIntoView)on.scrollIntoView({block:"nearest",inline:"nearest"});
}

function renderHome(){
  var html='<div class="grid">';
  MODS.forEach(function(m){
    var list=DATA?DATA[m.key]:null,top=list&&list[0];
    var cnt=list?list.length+"건":(ERR?"-":"불러오는 중");
    var lt=top?'<div class="lb">최근 · '+esc(top.label)+'</div><div class="lt">'+esc(top.title)+'</div>'
             :'<div class="lb">최근</div><div class="lt" style="color:var(--mut);font-weight:500">'+(list?"등록된 파일 없음":(ERR?"목록을 불러오지 못함":"불러오는 중"))+'</div>';
    html+='<section class="mod" style="--c:'+m.c+'"><h2>'+esc(m.name)+'<small>'+cnt+'</small></h2>'
      +'<p class="desc">'+esc(m.desc)+'</p><div class="latest">'+lt+'</div>'
      +'<div class="btns"><a class="btn pri" href="'+(top?href(top.path):"#")+'" aria-disabled="'+(!top)+'">최신 열기</a>'
      +'<a class="btn" href="#'+m.key+'">전체 목록</a></div></section>';
  });
  html+='</div>';
  if(ERR)html+='<div class="panel err">'+esc(ERR)+'</div>';
  document.getElementById("view").innerHTML=html;
}

function renderList(m){
  var v=document.getElementById("view");
  v.innerHTML='<section class="panel" style="--c:'+m.c+'"><h2>'+esc(m.name)+'</h2><p class="desc">'+esc(m.desc)+' · 폴더 <b>'+esc(m.dir)+'/</b></p>'
    +'<input class="search" id="q" type="search" placeholder="제목 또는 날짜 검색 (예: 2026-11, 실적)" autocomplete="off"><div id="list"></div></section>';
  var q=document.getElementById("q");
  function draw(){
    var box=document.getElementById("list");
    if(ERR){box.innerHTML='<div class="err">'+esc(ERR)+'</div>';return;}
    if(!DATA){box.innerHTML='<div class="empty">불러오는 중…</div>';return;}
    var kw=q.value.trim().toLowerCase().replace(/[-.]/g,"");
    var items=DATA[m.key].filter(function(it){
      if(!kw)return true;
      return (it.title+" "+it.label+" "+it.file).toLowerCase().replace(/[-.]/g,"").indexOf(kw)>=0;
    });
    if(!items.length){box.innerHTML='<div class="empty">'+(kw?"검색 결과가 없습니다.":"등록된 파일이 없습니다. "+esc(m.dir)+"/ 폴더에 파일을 올려주세요.")+'</div>';return;}
    var html="",cur=null;
    items.forEach(function(it){
      var g=it.y?it.y+"년 "+it.mo+"월":"날짜 미지정";
      if(g!==cur){if(cur!==null)html+="</div>";html+='<div class="mon"><h3>'+g+'</h3>';cur=g;}
      var tgt=VIEWABLE.test(it.file)?"":' download';
      html+='<a class="row" href="'+href(it.path)+'"'+tgt+'><span class="d">'+esc(it.label)+'</span><span class="t">'+esc(it.title)+'</span>'
        +(isNew(it)?'<span class="new">NEW</span>':'')+'<span class="badge">'+esc(it.ext||"file")+'</span></a>';
    });
    html+="</div>";
    box.innerHTML=html;
  }
  q.addEventListener("input",draw);
  draw();
}

function route(){
  var key=(location.hash||"#home").slice(1);
  var m=MODS.filter(function(x){return x.key===key;})[0];
  renderTabs(m?key:"home");
  if(m)renderList(m);else renderHome();
}
window.addEventListener("hashchange",function(){route();window.scrollTo(0,0);});
route();
loadTree().then(function(p){DATA=group(p);}).catch(function(e){ERR=e.message||"목록 조회 실패";}).then(route);
})();
</script>
</body>
</html>
