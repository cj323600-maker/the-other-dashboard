<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>전략기획 ERP</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--ink:#141B22;--bg:#F4F6F8;--card:#fff;--mut:#5B6773;--line:#E2E7EC;--blue:#1F5FBF;--soft:#F1F5FA;--ok:#1E7B47;--okbg:#E6F4EA;--bad:#B3261E;--badbg:#FBE9E7;
--c-daily:#1F5FBF;--c-weekly:#1E7B47;--c-monthly:#6B3FA0;--c-member:#E07B39;--c-trend:#2F5D8A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#E6EBF0;--bg:#0F1419;--card:#182029;--mut:#98A4AF;--line:#2A3540;--blue:#6E9EE8;--soft:#1D2834;--ok:#5CC48A;--okbg:#17321F;--bad:#F2928A;--badbg:#3A1C1A}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,"Malgun Gothic",sans-serif;font-variant-numeric:tabular-nums;word-break:keep-all;overflow-wrap:anywhere;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 48px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:4px 2px 14px;border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em}
.top .sub{font-size:13px;color:var(--mut);margin-top:4px}
.today{font-size:13.5px;color:var(--mut);text-align:right;line-height:1.5}
.today b{color:var(--ink)}
.dday{display:inline-block;margin-left:6px;font-size:12px;font-weight:800;color:#fff;background:var(--blue);border-radius:6px;padding:1px 7px}
nav.tabs{display:flex;gap:6px;margin:14px 0 0;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:0 0 auto;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:600;color:var(--mut);white-space:nowrap}
nav.tabs a.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
h2.sec{font-size:15px;font-weight:800;margin:22px 2px 10px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 10px}h2.sec>span{white-space:nowrap}
h2.sec small{font-size:12px;font-weight:500;color:var(--mut)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.kpi .kt{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13.5px;font-weight:700;color:var(--mut)}
.kpi .kv{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:6px;line-height:1.15}
.kpi .kv small{font-size:14px;font-weight:600;color:var(--mut);margin-left:4px}
.kpi .kd{font-size:12.5px;color:var(--mut);margin-top:4px}
.pill{font-size:11.5px;font-weight:700;border-radius:99px;padding:2px 9px;white-space:nowrap}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.pill.ok{background:var(--okbg)}.pill.bad{background:var(--badbg)}
.kpi.ph .kv{color:var(--mut);font-size:16px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.mod{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0;position:relative;overflow:hidden}
.mod:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.mod .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mod h3{margin:0;font-size:17px;font-weight:800}
.upd{font-size:12px;color:var(--mut);white-space:nowrap}
.upd.fresh{color:var(--ok);font-weight:700}
.mod .lt{font-size:14px;font-weight:700}
.mod .ls{font-size:12.5px;color:var(--mut);line-height:1.5}
.btns{display:flex;gap:8px;margin-top:auto}
.btn{flex:1;text-align:center;padding:9px 10px;border-radius:8px;font-size:14px;font-weight:700;border:1px solid var(--line);background:var(--card)}
.btn.pri{background:var(--c);border-color:var(--c);color:#fff}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:16px}
.panel h2{margin:0 0 4px;font-size:19px;font-weight:800}
.panel .desc{font-size:13px;color:var(--mut);margin:0 0 12px}
.live{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;padding:12px;margin-bottom:14px}
.live .t{flex:1;min-width:0;font-weight:700}
.live .s{font-size:12.5px;color:var(--mut);font-weight:500;margin-top:2px}
.tag{flex:0 0 auto;font-size:11px;font-weight:800;color:#fff;background:var(--c);border-radius:4px;padding:2px 7px}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:15px}
.mon{margin-top:16px}
.mon h4{font-size:13px;color:var(--mut);font-weight:700;margin:0 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row:hover{background:var(--soft)}
.row .d{flex:0 0 auto;font-size:13px;color:var(--mut);min-width:78px}
.row .t{flex:1;min-width:0;font-size:15px;font-weight:600}
.badge{flex:0 0 auto;font-size:11px;font-weight:700;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--mut);text-transform:uppercase}
.new{flex:0 0 auto;font-size:11px;font-weight:700;color:#fff;background:var(--bad);border-radius:4px;padding:1px 6px}
.empty,.err{padding:16px 4px;font-size:14px;color:var(--mut)}
.err{color:var(--bad)}
.rule{margin-top:22px;font-size:12.5px;color:var(--mut);line-height:1.75;border-top:1px solid var(--line);padding:14px 2px 0}
.rule code{background:var(--soft);padding:1px 5px;border-radius:4px;font-size:12px}
@media (max-width:760px){.kpis{grid-template-columns:1fr}.kpi .kv{font-size:26px}}
@media (max-width:480px){.top h1{font-size:20px}.today{text-align:left}.grid{grid-template-columns:1fr}.row .d{min-width:70px;font-size:12px}.row .t{font-size:14px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>전략기획 ERP</h1>
      <div class="sub">코오롱오토옥션 전략기획팀 · 일간·주간·월간보고와 분석 대시보드 통합</div>
    </div>
    <div class="today"><div id="today"></div><div id="auction"></div></div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="view"></main>
  <div class="rule">
    최신본은 각 저장소 업데이트 시 자동 반영 · 일간보고 <code>Daily-dashboard</code> · 주간보고 <code>week-dashboard</code> · 월간보고 <code>Month-dashboard</code> · 회원사 분석 <code>Country-dashboard</code> · 출품 및 낙찰 추이 <code>Auction-dashboard</code><br>
    지난 보고서는 이 저장소 메뉴별 폴더(<code>daily</code> <code>weekly</code> <code>monthly</code> <code>member</code> <code>trend</code>)에 <code>날짜_제목.html</code> 형식으로 보관
  </div>
</div>
<script>
(function(){
"use strict";
var CFG={owner:"cj323600-maker",repo:"the-other-dashboard",branch:"main"};
var h=location.hostname;
if(/\.github\.io$/.test(h)){CFG.owner=h.split(".")[0];var seg=location.pathname.split("/").filter(Boolean);if(seg.length&&!/\.html?$/.test(seg[0]))CFG.repo=seg[0];}

var MODS=[
  {key:"daily",  name:"일간보고",          dir:"daily",  src:"Daily-dashboard",   c:"var(--c-daily)"},
  {key:"weekly", name:"주간보고",          dir:"weekly", src:"week-dashboard",    c:"var(--c-weekly)"},
  {key:"monthly",name:"월간보고",          dir:"monthly",src:"Month-dashboard",   c:"var(--c-monthly)"},
  {key:"member", name:"회원사 분석",       dir:"member", src:"Country-dashboard", c:"var(--c-member)"},
  {key:"trend",  name:"출품 및 낙찰 추이", dir:"trend",  src:"Auction-dashboard", c:"var(--c-trend)"}
];
var VIEWABLE=/\.(html?|pdf|png|jpe?g|gif|svg|webp|txt|md)$/i;
var NEW_DAYS=3,now=new Date(),WK="일월화수목금토";
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function pad(n){return(n<10?"0":"")+n;}
function md(d){return(d.getMonth()+1)+"/"+d.getDate()+"("+WK[d.getDay()]+")";}
document.getElementById("today").innerHTML="<b>"+now.getFullYear()+"년 "+(now.getMonth()+1)+"월 "+now.getDate()+"일 ("+WK[now.getDay()]+")</b>";

// 경매일: 매주 수요일(안성). 일보에 경매일이 있으면 그 날짜를 우선 사용
function renderAuction(txt){
  var d=null,m=txt&&txt.match(/경매일\s*(\d{1,2})\/(\d{1,2})/);
  if(m){d=new Date(now.getFullYear(),+m[1]-1,+m[2]);if(d<new Date(now.getFullYear(),now.getMonth(),now.getDate()))d=null;}
  if(!d){d=new Date(now.getFullYear(),now.getMonth(),now.getDate());d.setDate(d.getDate()+((3-d.getDay()+7)%7));}
  var t0=new Date(now.getFullYear(),now.getMonth(),now.getDate()),dd=Math.round((d-t0)/86400000);
  document.getElementById("auction").innerHTML="다음 경매 <b>"+md(d)+"</b><span class=\"dday\">"+(dd===0?"D-DAY":"D-"+dd)+"</span>";
}
renderAuction("");

function parse(path){
  var file=path.split("/").pop(),ext=(file.match(/\.([^.]+)$/)||["",""])[1].toLowerCase(),base=file.replace(/\.[^.]+$/,"");
  var m=base.match(/^(\d{4})[-.]?(\d{2})(?:[-.]?(\d{2}))?(?:[_\s-]+(.*))?$/),y=null,mo=null,d=null,title=base.replace(/_/g," ");
  if(m){var mm=+m[2],dd=m[3]?+m[3]:null;if(mm>=1&&mm<=12&&(dd===null||(dd>=1&&dd<=31))){y=+m[1];mo=mm;d=dd;title=(m[4]||"").replace(/_/g," ").trim()||base;}}
  return{path:path,file:file,ext:ext,title:title,y:y,mo:mo,d:d,sortKey:y?(y*10000+mo*100+(d||0)):0,label:y?(y+"."+pad(mo)+(d?"."+pad(d):"")):"날짜 미지정",ts:y?new Date(y,mo-1,d||1).getTime():0};
}
function href(path){return path.split("/").map(encodeURIComponent).join("/");}

var CACHE_KEY="erp_tree_v1",CACHE_MS=5*60*1000;
function loadTree(){
  try{var c=JSON.parse(sessionStorage.getItem(CACHE_KEY)||"null");if(c&&Date.now()-c.t<CACHE_MS)return Promise.resolve(c.paths);}catch(e){}
  return fetch("https://api.github.com/repos/"+CFG.owner+"/"+CFG.repo+"/git/trees/"+CFG.branch+"?recursive=1",{headers:{Accept:"application/vnd.github+json"}}).then(function(r){
    if(!r.ok)throw new Error(r.status===403?"GitHub 조회 한도 초과 (잠시 후 새로고침)":"목록 조회 실패 ("+r.status+")");return r.json();
  }).then(function(j){
    var paths=(j.tree||[]).filter(function(t){return t.type==="blob";}).map(function(t){return t.path;});
    try{sessionStorage.setItem(CACHE_KEY,JSON.stringify({t:Date.now(),paths:paths}));}catch(e){}
    return paths;
  });
}

var DATA=null,ERR=null,LIVE={},KPI=null;
function liveUrl(m){return(/\.github\.io$/.test(h)?"/":"https://"+CFG.owner+".github.io/")+m.src+"/";}
function ago(t){
  if(!t)return"";var s=(now-t)/1000,x=new Date(t);
  var rel=s<3600?Math.max(1,Math.round(s/60))+"분 전":s<86400?Math.round(s/3600)+"시간 전":Math.round(s/86400)+"일 전";
  return md(x)+" "+pad(x.getHours())+":"+pad(x.getMinutes())+" · "+rel;
}
function txt(el){return el?el.textContent.replace(/\s+/g," ").trim():"";}
function loadLive(m){
  return fetch(liveUrl(m)+"?t="+Date.now(),{cache:"no-store"}).then(function(r){
    if(!r.ok)throw 0;var lm=Date.parse(r.headers.get("last-modified")||"");return r.text().then(function(t){return[t,lm];});
  }).then(function(a){
    var doc=new DOMParser().parseFromString(a[0],"text/html");
    var st=txt(doc.querySelector(".sub")).replace(/\[대외비\]/g,"").trim();if(st.length>80)st=st.slice(0,80)+"…";
    LIVE[m.key]={title:(doc.title||m.name).trim(),sub:st,lm:isNaN(a[1])?0:a[1]};
    if(m.key==="daily"){renderAuction(st);KPI=readKpi(doc);}
  }).catch(function(){LIVE[m.key]={title:m.name+" 최신본",sub:"",lm:0};});
}
// 일보 상단 카드 3개(출품대수·낙찰대수·매출이익)를 그대로 읽어 표시
function readKpi(doc){
  var out=[];
  doc.querySelectorAll(".kpis .card").forEach(function(c){
    var lab=txt(c.querySelector(".ct > span")),pill=c.querySelector(".pill"),cv=c.querySelector(".cv");
    if(!cv)return;var main=cv.querySelector("span"),small=cv.querySelector("small"),cd=c.querySelector(".cd");
    out.push({lab:lab,pill:txt(pill),ok:!!(pill&&/v-ok/.test(pill.className)),v:txt(main),unit:txt(small),d:txt(cd&&cd.querySelector("b"))+" "+(cd?txt(cd).replace(txt(cd.querySelector("b")),"").split("·")[0].trim():"")});
  });
  return out.length?out:null;
}

function group(paths){
  var out={};
  MODS.forEach(function(m){
    out[m.key]=paths.filter(function(p){if(p.indexOf(m.dir+"/")!==0)return false;var f=p.split("/").pop();return f.charAt(0)!=="."&&!/^readme\.md$/i.test(f);})
      .map(parse).sort(function(a,b){return b.sortKey-a.sortKey||a.file.localeCompare(b.file,"ko");});
  });
  return out;
}
function isNew(it){return it.ts&&(now.getTime()-it.ts)<NEW_DAYS*86400000&&it.ts<=now.getTime();}

function renderTabs(cur){
  var html='<a href="#home" class="'+(cur==="home"?"on":"")+'">홈</a>';
  MODS.forEach(function(m){html+='<a href="#'+m.key+'" class="'+(cur===m.key?"on":"")+'">'+esc(m.name)+'</a>';});
  document.getElementById("tabs").innerHTML=html;
  var on=document.querySelector("nav.tabs a.on");if(on&&on.scrollIntoView)on.scrollIntoView({block:"nearest",inline:"nearest"});
}

function renderHome(){
  var lv=LIVE.daily,html='<h2 class="sec"><span>일간보고 핵심</span><small>'+(lv&&lv.sub?esc(lv.sub.split("·").slice(0,3).join("·")):"")+'</small></h2><div class="kpis">';
  if(KPI){KPI.forEach(function(k){
    html+='<a class="kpi" href="'+liveUrl(MODS[0])+'"><div class="kt"><span>'+esc(k.lab)+'</span>'+(k.pill?'<span class="pill '+(k.ok?"ok":"bad")+'">'+esc(k.pill.replace("주 목표 대비 달성률","달성률"))+'</span>':'')+'</div>'
      +'<div class="kv"><span class="'+(k.ok?"ok":"bad")+'">'+esc(k.v)+'</span><small>'+esc(k.unit)+'</small></div><div class="kd">'+esc(k.d)+'</div></a>';
  });}else{for(var i=0;i<3;i++)html+='<div class="kpi ph"><div class="kv">'+(LIVE.daily?"표시할 항목 없음":"불러오는 중")+'</div></div>';}
  html+='</div><h2 class="sec"><span>보고서</span><small>최신본 기준</small></h2><div class="grid">';
  MODS.forEach(function(m){
    var list=DATA?DATA[m.key]:null,v=LIVE[m.key],fresh=v&&v.lm&&(now-v.lm)<36*3600000;
    html+='<section class="mod" style="--c:'+m.c+'"><div class="hd"><h3>'+esc(m.name)+'</h3><span class="upd'+(fresh?" fresh":"")+'">'+(v&&v.lm?"업데이트 "+esc(ago(v.lm)):"")+'</span></div>'
      +'<div><div class="lt">'+esc(v?v.title:"불러오는 중")+'</div>'+(v&&v.sub?'<div class="ls">'+esc(v.sub)+'</div>':'')+'</div>'
      +'<div class="btns"><a class="btn pri" href="'+liveUrl(m)+'">최신 열기</a><a class="btn" href="#'+m.key+'">지난 보고서'+(list?" "+list.length+"건":"")+'</a></div></section>';
  });
  html+='</div>';
  if(ERR)html+='<div class="panel err">지난 보고서 목록: '+esc(ERR)+'</div>';
  document.getElementById("view").innerHTML=html;
}

function renderList(m){
  var v=LIVE[m.key];
  document.getElementById("view").innerHTML='<section class="panel" style="--c:'+m.c+'"><h2>'+esc(m.name)+'</h2><p class="desc">최신본은 '+esc(m.src)+' 저장소, 지난 보고서는 보관 폴더 '+esc(m.dir)+'/</p>'
    +'<a class="live" href="'+liveUrl(m)+'"><div class="t">'+esc(v?v.title:m.name)+(v&&v.lm?'<div class="s">업데이트 '+esc(ago(v.lm))+'</div>':'')+'</div><span class="tag">최신본</span></a>'
    +'<input class="search" id="q" type="search" placeholder="지난 보고서 검색 (예: 2026-11, 10월)" autocomplete="off"><div id="list"></div></section>';
  var q=document.getElementById("q");
  function draw(){
    var box=document.getElementById("list");
    if(ERR){box.innerHTML='<div class="err">'+esc(ERR)+'</div>';return;}
    if(!DATA){box.innerHTML='<div class="empty">불러오는 중</div>';return;}
    var kw=q.value.trim().toLowerCase().replace(/[-.]/g,"");
    var items=DATA[m.key].filter(function(it){return!kw||(it.title+" "+it.label+" "+it.file).toLowerCase().replace(/[-.]/g,"").indexOf(kw)>=0;});
    if(!items.length){box.innerHTML='<div class="empty">'+(kw?"검색 결과가 없습니다.":"보관된 지난 보고서가 없습니다.")+'</div>';return;}
    var html="",cur=null;
    items.forEach(function(it){
      var g=it.y?it.y+"년 "+it.mo+"월":"날짜 미지정";
      if(g!==cur){if(cur!==null)html+="</div>";html+='<div class="mon"><h4>'+g+'</h4>';cur=g;}
      html+='<a class="row" href="'+href(it.path)+'"'+(VIEWABLE.test(it.file)?"":" download")+'><span class="d">'+esc(it.label)+'</span><span class="t">'+esc(it.title)+'</span>'
        +(isNew(it)?'<span class="new">NEW</span>':'')+'<span class="badge">'+esc(it.ext||"file")+'</span></a>';
    });
    box.innerHTML=html+"</div>";
  }
  q.addEventListener("input",draw);draw();
}

function route(){
  var key=(location.hash||"#home").slice(1),m=MODS.filter(function(x){return x.key===key;})[0];
  renderTabs(m?key:"home");if(m)renderList(m);else renderHome();
}
window.addEventListener("hashchange",function(){route();window.scrollTo(0,0);});
route();
Promise.all(MODS.map(loadLive)).then(route);
loadTree().then(function(p){DATA=group(p);}).catch(function(e){ERR=e.message||"목록 조회 실패";}).then(route);
})();
</script>
</body>
</html>
