function sheet(u){const t=u.v==='강함', c=u.v==='약함'||u.v==='중단';
  const ord=t?`<div class="ord"><small>영업 오더</small>${u.nm} ${u.yr}, ${bestY(u.seg)}주행거리 ${u.km} 위주로 더 출품 (경매 1회당 약 +${u.q}대)</div>`:c?`<div class="ord c"><small>회원 모집 대상</small>${u.nm} ${u.yr}은 제값에 나와도 낙찰률 ${u.fr.toFixed(1)}%로 50% 미만</div>`:`<div class="ord h"><small style="color:#9A9CA6">지시 없음</small>${u.fn<30?'제값에 나온 차가 '+u.fn+'대로 30대 미만(표본 적음)':(u.fr>=50&&u.fr<=55)?'제값 낙찰률 '+u.fr.toFixed(1)+'%로 기준선(50~55%) 사이':'제값 낙찰률 '+u.fr.toFixed(1)+'%로 기준은 넘었지만 신뢰도 '+(u.cf==null?'':u.cf+'%로 ')+'80% 미만'}</div>`;
  const mxc=Math.max(1,...u.ct.map(x=>x[1]));
  return `<div class="dim" data-close="1"></div><div class="sheet" role="dialog" aria-label="${u.nm} ${u.yr}"><div class="bar"></div><h3>${u.nm} ${u.yr}</h3><span class="tg ${cls(u)}">${VN[u.v]}${u.cf!=null&&u.v!=='보류'?' · 신뢰도 '+(u.cf>=99.5?'99% 이상':u.cf+'%'):''}</span>${ord}
   <div class="fx"><div><span>제값 낙찰률</span><b>${u.fn?u.fr.toFixed(1)+'%':'-'}</b><small>${f(u.fn)}대 중 ${f(u.fw)}대</small></div><div><span>${mk} 낙찰</span><b>${f(u.w)}대</b><small>이 차 낙찰의 ${u.sh}%</small></div><div><span>낙찰가 중앙값</span><b>${f(u.p50)}</b><small>만원</small></div></div>
   <details class="more"><summary>많이 사 간 나라 · 회원사 · 연식 1년 단위 표</summary>${u.ct.length?`<div class="sh4">많이 사 간 나라 (대)</div>`+u.ct.map(x=>`<div class="br"><span>${x[0]}</span><u><i style="width:${x[1]/mxc*100}%"></i></u><b>${f(x[1])}대</b></div>`).join(''):''}
   ${buyers(u.tb,u.w)}${segT(u.seg)}</details><button class="lnk" data-pop="${u.nm}|${u.yr}">${u.nm} ${u.yr} 판정 세부 근거 보기 ›</button><button class="cls" data-close="1">닫기</button></div>`;}
// 세부 근거 팝업: 상세 화면을 한 번만 미리 불러 두고(숨김), 누르면 차종만 바꿔 바로 보여 줌(2026-11-26 사용자 지적: 매번 새로 불러와 느림)
let popReady=false, popWant=null; const POPV='261127041627';
const popUrl=k=>'./index.html?v='+POPV+'#pop='+encodeURIComponent(k);
function popFrame(){let d=document.getElementById('popf'); if(!d){d=document.createElement('div'); d.id='popf'; d.className='off wait'; d.innerHTML=`<div class="pl">세부 근거를 불러오는 중</div><iframe title="차량 선정 세부 근거"></iframe><button data-popx="1" aria-label="세부 근거 닫기">닫기 ✕</button>`; document.body.appendChild(d);
    const fr=d.querySelector('iframe'); fr.addEventListener('load',()=>{popReady=true; d.classList.remove('wait'); if(popWant&&!decodeURIComponent(fr.src).endsWith('#pop='+popWant)) fr.src=popUrl(popWant);}); fr.src=popUrl(popWant||'_');} return d;}
function showPop(k){popWant=k; const d=popFrame(), fr=d.querySelector('iframe'); d.classList.remove('off'); if(popReady) fr.src=popUrl(k);   // 같은 파일이라 주소 끝(#)만 바뀜 = 다시 불러오지 않고 차종만 바뀜
  clearTimeout(showPop.t); showPop.t=setTimeout(()=>d.classList.remove('wait'),5000);}
function closePop(){const d=document.getElementById('popf'); if(d) d.classList.add('off'); popWant=null;}
addEventListener('message',e=>{if(e.data==='mt-pop-close') closePop();});
addEventListener('keydown',e=>{if(e.key==='Escape') closePop();}); addEventListener('load',()=>setTimeout(popFrame,600));
document.addEventListener('click',e=>{const pp=e.target.closest('[data-pop]'); if(pp){showPop(pp.dataset.pop); return;}
  if(e.target.closest('[data-popx]')){closePop();return;}
  const md=e.target.closest('[data-mode]'); if(md){mode=md.dataset.mode;ssel=null;steam=null;sel=null;grp=null;render();scrollTo(0,0);return;}
  if(e.target.closest('[data-rc]')){const tx=[...document.querySelectorAll('#rpt li')].map((l,i)=>(i+1)+'. '+l.textContent).join('\n'); const hd=document.querySelector('#rpt .rh b').textContent; (navigator.clipboard?navigator.clipboard.writeText(hd+'\n'+tx):Promise.reject()).then(()=>{e.target.textContent='복사됨'}).catch(()=>{e.target.textContent='복사 안 됨'}); return;}
  if(e.target.closest('[data-rp]')){document.body.classList.add('prt'); window.print(); document.body.classList.remove('prt'); return;}
  if(mode!=='car'){const tt=e.target.closest('[data-t]'); if(tt){steam=tt.dataset.t;ssel=null;render();if(!wide())scrollTo(0,0);return;} const ss=e.target.closest('[data-s]'); if(ss){const a=ss.dataset.s.split(':');ssel=[a[0],+a[1],1];render();return;}
    if(e.target.closest('[data-close]')){ssel=mode==='res'&&ssel?[ssel[0],ssel[1]]:null;render();return;} if(e.target.closest('[data-back]')){steam=null;ssel=null;render();scrollTo(0,0);return;} const m0=e.target.closest('[data-mk]'); if(m0){mk=m0.dataset.mk;ssel=null;render();} return;}
  const q1=e.target.closest('[data-fo]'); if(q1){const v=q1.dataset.fo; fo=(v==='all'||fo===v)?null:v; render(); return;} const q2=e.target.closest('[data-fu]'); if(q2){const v=q2.dataset.fu; fu=(v==='all'||fu===v)?null:v; render(); return;}
  const m=e.target.closest('[data-mk]'); if(m){mk=m.dataset.mk;grp=null;sel=null;fo=null;fu=null;render();if(!wide())scrollTo(0,0);return;}
  if(e.target.closest('[data-close]')&&!wide()){sel=null;render();return;} if(e.target.closest('[data-back]')){grp=null;render();scrollTo(0,0);return;}
  const k=e.target.closest('[data-k]'); if(k){const v=k.dataset.k; if(v.startsWith('f:')){sel={fine:+v.slice(2)};render();} else if(v.startsWith('g:')){grp=v.slice(2);if(wide())sel=null;render();if(!wide())scrollTo(0,0);} else {const [n,y]=v.slice(2).split('|'); sel=X[mk].g.flatMap(g=>g.u).find(u=>u.nm===n&&u.yr===y); render();}}});
addEventListener('resize',render); render();
</script></body></html>
