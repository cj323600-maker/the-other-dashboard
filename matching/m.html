  let p1=`<div class="sec"><h2>오더 효과</h2></div><div class="verdict ${good?'ok':'no'}"><small>${md(x.test)} 경매 · 오더를 전부 따랐다면</small><div class="v3"><span>출품대수<b>${sg(x.n1-x.n)}<small>대</small></b></span><span>낙찰대수<b>${sg(d)}<small>대</small></b></span><span>낙찰률<b>${(dr>=0?'+':'−')+Math.abs(dr).toFixed(1)}<small>%p</small></b></span></div></div>
   <div class="kp"><div><span>실제 낙찰</span><b>${f(x.w)}<small>대</small></b><span>낙찰률 ${pc(x.w,x.n)}%</span></div><div><span>오더대로 낙찰</span><b style="color:#5BA2FF">${f(x.w1)}<small>대</small></b><span>낙찰률 ${pc(x.w1,x.n1)}%</span></div><div><span>차이</span><b>${sg(d)}<small>대</small></b><span>출품 ${sg(x.n1-x.n)}대</span></div></div>
   <div class="sec"><h2>최근 ${S.length}회차 추이</h2></div>${chart}<div class="lg"><span>막대 = 오더대로 했을 때 낙찰 증가(대) · 막대를 누르면 그 회차 · ${S.length}회차 합 ${sg(dw)}대, ${up}회차에서 증가</span></div><table class="t8"><thead><tr><th>경매일</th><th>출품대수 (대)<small>실제 / 오더대로</small></th><th>낙찰대수 (대)<small>실제 / 오더대로</small></th><th>낙찰률 (%)<small>실제 / 오더대로</small></th></tr></thead><tbody>`+S.map((o,i)=>`<tr class="${i===ssel[1]?'on':''}" data-s="res:${i}"><th>${md(o.test)}</th><td>${f(o.n)} / <b>${f(o.n1)}</b></td><td>${f(o.w)} / <b>${f(o.w1)}</b></td><td>${pc(o.w,o.n)} / <b>${pc(o.w1,o.n1)}</b></td></tr>`).join('')+`</tbody></table>`;
  // 2단: 회차별 줄
  let p2=`<div class="sec"><h2>회차별 낙찰</h2></div><div class="list">`+S.map((o,i)=>{const v=o.w1-o.w; return `<button class="row${ssel[1]===i?' on':''}" data-s="res:${i}"><div><b>${md(o.test)} 경매</b><span>실제 ${f(o.w)}대 ${pc(o.w,o.n)}% · 오더대로 ${f(o.w1)}대 ${pc(o.w1,o.n1)}%</span><u class="rb"><i style="width:${Math.abs(v)/mx*100}%"></i></u></div><em class="${v>0?'c-take':''}">${sg(v)}대<small>낙찰</small></em></button>`}).join('')+`</div>`;
  // 3단: 오더별 차이 + 판정 검증
  const jr=(a,b)=>a?pc(b,a)+'%':'-', tk=x.jg[0]?x.jg[1]/x.jg[0]*100:null, ck=x.jc[0]?x.jc[1]/x.jc[0]*100:null, br=(v)=>Math.min(100,Math.abs(v)/Math.max(1,Math.abs(d))*100);
  const p3i=`<h3>${md(x.test)} 경매</h3><span class="tg ${good?'t-take':'t-hold'}">오더대로 했다면 낙찰 ${sg(d)}대</span>
   <div class="sh4">오더별 낙찰 차이 (대)</div>
   <div class="br"><span>희망가 조정 연락</span><u><i style="width:${br(x.g)}%"></i></u><b>+${f(x.g)}대</b></div>
   <div class="br"><span>더 가져올 차</span><u><i style="width:${br(x.bw)}%"></i></u><b>+${f(x.bw)}대</b></div>
   <div class="br"><span>받기 전 확인</span><u><i style="width:${br(x.cw)}%;background:var(--w1)"></i></u><b>−${f(x.cw)}대</b></div>
   <div class="fx" style="margin-top:12px"><div><span>희망가 조정</span><b>${f(x.an)}대</b><small>연락</small></div><div><span>더 가져올 차</span><b>${f(x.badd)}대</b><small>${f(x.bu)}종 추가 출품</small></div><div><span>받기 전 확인</span><b>${f(x.cn)}대</b><small>안 받음</small></div></div>
   <div class="sh4">판정이 맞았나 (그 회차 제값 낙찰률)</div>
   <div class="fx"><div><span>더 가져올 차 판정</span><b style="color:${tk!=null&&tk>55?'#5BA2FF':'#F0A56A'}">${jr(x.jg[0],x.jg[1])}</b><small>${f(x.jg[0])}대 중 ${f(x.jg[1])}대 · 기준 55% 초과</small></div><div><span>받기 전 확인 판정</span><b style="color:${ck!=null&&ck<50?'#5BA2FF':'#F0A56A'}">${jr(x.jc[0],x.jc[1])}</b><small>${f(x.jc[0])}대 중 ${f(x.jc[1])}대 · 기준 50% 미만</small></div><div><span>회차 전체 낙찰률</span><b>${pc(x.w,x.n)}%</b><small>출품 ${f(x.n)}대</small></div></div>`;
  const best=[['희망가 조정 연락',x.g],['더 가져올 차',x.bw]].sort((a,b)=>b[1]-a[1])[0];
  const lines=[`${md(x.test)} 경매에서 오더를 전부 따랐다면 낙찰은 실제 ${f(x.w)}대, 오더대로 ${f(x.w1)}대(${sg(d)}대)입니다.`,
    `낙찰률은 실제 ${pc(x.w,x.n)}%, 오더대로 ${pc(x.w1,x.n1)}%(${(dr>=0?'+':'−')+Math.abs(dr).toFixed(1)}%p)입니다.`,
    `오더별로는 희망가 조정 연락 +${f(x.g)}대, 더 가져올 차 +${f(x.bw)}대, 받기 전 확인 −${f(x.cw)}대이고 ${best[0]}의 효과가 가장 큽니다.`,
    `판정 검증: 더 가져올 차 판정 차량의 제값 낙찰률 ${jr(x.jg[0],x.jg[1])}(기준 55% ${tk!=null&&tk>55?'초과':'미달'}), 받기 전 확인 판정 차량 ${jr(x.jc[0],x.jc[1])}(기준 50% ${ck!=null&&ck<50?'미만으로 판정과 같음':'이상으로 판정과 다름'}).`,
    `최근 ${S.length}회차 합으로는 낙찰 ${sg(dw)}대이고 ${S.length}회차 중 ${up}회차에서 늘었습니다.`];
  const rpt=`<div class="rpt" id="rpt"><div class="rh"><b>결과 리포트 · ${md(x.test)} 경매</b><span><button data-rc="1">복사</button><button data-rp="1">인쇄 / PDF 저장</button></span></div><ol>${lines.map(l=>`<li>${l}</li>`).join('')}</ol><small>회차를 고르면 자동으로 다시 씁니다 · 코오롱오토옥션 전략기획팀</small></div>`;
  const el=document.getElementById('app'); el.className='app'+(W?' g w':'')+' alt';
  el.innerHTML=HD()+`<div class="pane p1">${p1}${W?'':p2}</div><div class="pane p2">${W?p2:''}</div><div class="pane p3">${W?`<div class="sec"><h2>회차 상세</h2></div><div class="sheet" role="dialog">${p3i}</div>${rpt}`:''}</div>`+(!W&&ssel&&ssel[2]?wrapSheet(p3i,false):'');}
function render(){if(mode==='res') return renderRes(); if(mode==='sales') return renderSales(); if(mode==='mem') return renderMem(); const D=X[mk], W=wide(); const all=D.g.flatMap(g=>g.u), take=all.filter(u=>u.v==='강함'&&main(u)), chk=all.filter(u=>(u.v==='약함'||u.v==='중단')&&main(u));
  const ords=[...take,...chk].sort((a,b)=>b.cf-a.cf);
  if(W&&!grp) grp=D.g[0].g; if(W&&!sel) sel=ords[0]||D.g.find(g=>g.g===grp).u[0];
  const pw=W?Math.min(innerWidth,1560)/3.1:Math.min(innerWidth,480)*0.9;
  let hd=HD();
  const seg=`<div class="seg" role="group" aria-label="시장 선택">${['수출','내수'].map(m=>`<button data-mk="${m}" aria-pressed="${m===mk}">${m}</button>`).join('')}</div>`;
  // 1단계
  let p1=`<div class="sec"><h2>누가 사 가는 차</h2>${seg}</div><div class="kp"><div><span>${mk} 낙찰</span><b>${f(D.tot)}<small>대</small></b></div><div><span>더 가져올 차</span><b style="color:#5BA2FF">${take.length}<small>종</small></b></div><div><span>받기 전 확인</span><b style="color:#F0A56A">${chk.length}<small>종</small></b></div></div>`;
  const it=D.g.map(g=>{const t=g.u.filter(u=>u.v==='강함'&&main(u)).length, c=g.u.filter(u=>(u.v==='약함'||u.v==='중단')&&main(u)).length; return {v:g.w,k:'g:'+g.g,t:g.g,s:f(g.w)+'대',m:(t?'더 가져올 차 '+t+'종':'')+(t&&c?' · ':'')+(c?'받기 전 확인 '+c+'종':''),c:(W&&g.g===grp?'cur ':'')+(t?(t>=3?'t-take':'t-take2'):(c?'t-chk':'t-hold2'))}});
  p1+=`<div class="tm" style="height:340px">${tiles(it,340,pw)}</div><div class="lg"><span><i style="background:var(--b1)"></i>더 가져올 차가 있는 차군</span><span><i style="background:var(--w1)"></i>받기 전 확인만 있는 차군</span><span><i style="background:var(--g1)"></i>지시 없음</span><span>칸 크기 = ${mk} 낙찰 대수 · 누르면 차종</span></div>`;
  p1+=`<div class="gap" style="margin-top:14px"></div><div class="sec"><h2>이번 주 오더</h2></div><div class="list">`+(ords.length?ords.slice(0,8).map(u=>row(u)).join(''):`<div class="row"><span>${mk} 회원이 주로 사는 차 중 신뢰도 80% 이상 지시 없음</span></div>`)+`</div><a class="lnk tofull" href="./index.html">팀별 오더 · 판정 근거 · 리포트 (상세 화면) ›</a>`;
  // 2단계
  let p2='';
  if(grp){const G=D.g.find(g=>g.g===grp), top=G.u.slice(0,14), rest=G.u.slice(14).reduce((a,u)=>a+u.w,0);
    p2=`<div class="sec"><h2>${grp}</h2>${W?'':seg}</div><div class="crumb">${W?'':`<button data-back="1">‹ ${mk} 전체</button>`}<span>${mk}</span>›<b>${grp}</b><span>낙찰 ${f(G.w)}대</span></div>`;
    const it2=top.map(u=>({v:u.w,k:'u:'+u.nm+'|'+u.yr,t:u.nm,s:u.yr,m:f(u.w)+'대',c:(sel&&sel.nm===u.nm&&sel.yr===u.yr?'cur ':'')+cls(u)}));
    p2+=`<div class="tm" style="height:420px">${tiles(it2,420,pw)}</div><div class="lg"><span><i style="background:var(--b1)"></i>더 가져올 차</span><span><i style="background:var(--w1)"></i>받기 전 확인</span><span><i style="background:var(--g2)"></i>판단 보류</span>${rest?`<span>그 밖 ${G.u.length-14}종 ${f(rest)}대</span>`:''}</div>`;
    p2+=`<div class="gap" style="margin-top:14px"></div><div class="sec"><h2>${grp} 차종 × 연식</h2></div><div class="list">`+top.map(u=>row(u)).join('')+`</div>`;}
  const p3=sel?sheet(sel):(W?`<div class="empty3">차종 × 연식 칸을 누르면 오더와 근거가 여기에 나옵니다</div>`:'');
  const note=`<div class="note">판정 = 최근 16회차 제값(희망가가 같은 조건 낙찰가 중앙값 ±5%) 출품 30대 이상 · 제값 낙찰률 55% 초과 = 더 가져올 차 · 50% 미만 = 받기 전 확인 · 신뢰도 80% 이상만 지시. 칸 크기 = 그 시장 회원이 낙찰받은 대수. 오더 수 = 그 시장 회원이 낙찰의 절반 이상을 사 간 차만.</div>`;
  const el=document.getElementById('app'); el.className='app'+(grp?' g':'')+(W?' w':'');
  el.innerHTML=hd+`<div class="pane p1">${p1}${W?'':note}</div><div class="pane p2">${p2}${W?'':note}</div><div class="pane p3">${W?`<div class="sec"><h2>오더와 근거</h2></div>`:''}${p3}${W?note:''}</div>`;}
function row(u){const t=u.v==='강함', c=u.v==='약함'||u.v==='중단';
  return `<button class="row" data-k="u:${u.nm}|${u.yr}"><div><b>${u.nm} ${u.yr}</b><span>${mk} 낙찰 ${f(u.w)}대 · 주행거리 ${u.km} 많음</span></div><em class="${t?'c-take':c?'c-chk':''}">${t?'더 가져올 차':c?'받기 전 확인':'판단 보류'}<small>제값 낙찰률 ${u.fn>=30?u.fr.toFixed(1)+'%':'표본 적음'}</small></em></button>`;}
function sheet(u){const t=u.v==='강함', c=u.v==='약함'||u.v==='중단';
  const ord=t?`<div class="ord"><small>영업 오더</small>${u.nm} ${u.yr}, 주행거리 ${u.km} 위주로 더 출품 (경매 1회당 약 +${u.q}대)</div>`:c?`<div class="ord c"><small>영업 오더</small>${u.nm} ${u.yr}은 희망가가 낙찰가 중앙값 ${f(u.p50)}만원 이하일 때만 받기</div>`:`<div class="ord h"><small style="color:#9A9CA6">지시 없음</small>${u.fn<30?'제값에 나온 차가 '+u.fn+'대로 30대 미만(표본 적음)':(u.fr>=50&&u.fr<=55)?'제값 낙찰률 '+u.fr.toFixed(1)+'%로 기준선(50~55%) 사이':'제값 낙찰률 '+u.fr.toFixed(1)+'%로 기준은 넘었지만 신뢰도 '+(u.cf==null?'':u.cf+'%로 ')+'80% 미만'}</div>`;
  const mxc=Math.max(1,...u.ct.map(x=>x[1]));
  return `<div class="dim" data-close="1"></div><div class="sheet" role="dialog" aria-label="${u.nm} ${u.yr}"><div class="bar"></div><h3>${u.nm} ${u.yr}</h3><span class="tg ${cls(u)}">${VN[u.v]}${u.cf!=null&&u.v!=='보류'?' · 신뢰도 '+(u.cf>=99.5?'99% 이상':u.cf+'%'):''}</span>${ord}
   <div class="fx"><div><span>제값 낙찰률</span><b>${u.fn?u.fr.toFixed(1)+'%':'-'}</b><small>${f(u.fn)}대 중 ${f(u.fw)}대</small></div><div><span>${mk} 낙찰</span><b>${f(u.w)}대</b><small>이 차 낙찰의 ${u.sh}%</small></div><div><span>낙찰가 중앙값</span><b>${f(u.p50)}</b><small>만원</small></div></div>
   ${u.ct.length?`<div class="sh4">많이 사 간 나라 (대)</div>`+u.ct.map(x=>`<div class="br"><span>${x[0]}</span><u><i style="width:${x[1]/mxc*100}%"></i></u><b>${f(x[1])}대</b></div>`).join(''):''}
   ${buyers(u.tb,u.w)}<div class="sh4">많이 나온 세부모델</div><div style="font-size:14px">${u.det.join(', ')}</div><button class="lnk" data-pop="${u.nm}|${u.yr}">차량 선정 세부 근거 보기 ›</button><button class="cls" data-close="1">닫기</button></div>`;}
// 세부 근거 팝업: 상세 화면을 한 번만 미리 불러 두고(숨김), 누르면 차종만 바꿔 바로 보여 줌(2026-11-26 사용자 지적: 매번 새로 불러와 느림)
let popReady=false, popWant=null;
function popFrame(){let d=document.getElementById('popf'); if(!d){d=document.createElement('div'); d.id='popf'; d.className='off'; d.innerHTML=`<div class="pl">세부 근거를 불러오는 중</div><iframe title="차량 선정 세부 근거" src="./index.html#pop=_"></iframe><button data-popx="1" aria-label="세부 근거 닫기">닫기 ✕</button>`; document.body.appendChild(d);} return d;}
function showPop(k){const d=popFrame(), fr=d.querySelector('iframe'); popWant=k; d.classList.remove('off'); d.classList.toggle('wait',!popReady); if(popReady){try{fr.contentWindow.location.hash='pop='+encodeURIComponent(k)}catch(_){fr.src='./index.html#pop='+encodeURIComponent(k)}}}
function closePop(){const d=document.getElementById('popf'); if(d) d.classList.add('off'); popWant=null;}
addEventListener('message',e=>{if(e.data==='mt-pop-close') closePop(); if(e.data==='mt-pop-ready'){const first=!popReady; popReady=true; const d=document.getElementById('popf'); if(d) d.classList.remove('wait'); if(first&&popWant) showPop(popWant);}});
addEventListener('keydown',e=>{if(e.key==='Escape') closePop();}); addEventListener('load',()=>setTimeout(popFrame,600));
document.addEventListener('click',e=>{const pp=e.target.closest('[data-pop]'); if(pp){showPop(pp.dataset.pop); return;}
  if(e.target.closest('[data-popx]')){closePop();return;}
  const md=e.target.closest('[data-mode]'); if(md){mode=md.dataset.mode;ssel=null;steam=null;sel=null;grp=null;render();scrollTo(0,0);return;}
  if(e.target.closest('[data-rc]')){const tx=[...document.querySelectorAll('#rpt li')].map((l,i)=>(i+1)+'. '+l.textContent).join('\n'); const hd=document.querySelector('#rpt .rh b').textContent; (navigator.clipboard?navigator.clipboard.writeText(hd+'\n'+tx):Promise.reject()).then(()=>{e.target.textContent='복사됨'}).catch(()=>{e.target.textContent='복사 안 됨'}); return;}
  if(e.target.closest('[data-rp]')){document.body.classList.add('prt'); window.print(); document.body.classList.remove('prt'); return;}
  if(mode!=='car'){const tt=e.target.closest('[data-t]'); if(tt){steam=tt.dataset.t;ssel=null;render();if(!wide())scrollTo(0,0);return;} const ss=e.target.closest('[data-s]'); if(ss){const a=ss.dataset.s.split(':');ssel=[a[0],+a[1],1];render();return;}
    if(e.target.closest('[data-close]')){ssel=mode==='res'&&ssel?[ssel[0],ssel[1]]:null;render();return;} if(e.target.closest('[data-back]')){steam=null;ssel=null;render();scrollTo(0,0);return;} const m0=e.target.closest('[data-mk]'); if(m0){mk=m0.dataset.mk;ssel=null;render();} return;}
  const m=e.target.closest('[data-mk]'); if(m){mk=m.dataset.mk;grp=null;sel=null;render();if(!wide())scrollTo(0,0);return;}
  if(e.target.closest('[data-close]')&&!wide()){sel=null;render();return;} if(e.target.closest('[data-back]')){grp=null;render();scrollTo(0,0);return;}
  const k=e.target.closest('[data-k]'); if(k){const v=k.dataset.k; if(v.startsWith('g:')){grp=v.slice(2);if(wide())sel=null;render();if(!wide())scrollTo(0,0);} else {const [n,y]=v.slice(2).split('|'); sel=X[mk].g.flatMap(g=>g.u).find(u=>u.nm===n&&u.yr===y); render();}}});
addEventListener('resize',render); render();
